<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админ‑панель — Планировка</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<script src="shared/catalog-types.js"></script>
<style>
:root{
  --bg:#f5f5f3; --surface:#ffffff; --surface-2:#f0f0ee; --border:#e3e3df; --text:#1a1b1e; --muted:#6f7378;
  --accent:#2f6fe4; --accent-soft:#e7eefc; --danger:#d64545; --danger-soft:#fbe9e9; --success:#2e9e5b; --success-soft:#e5f4ea; --warning:#b7791f; --warning-soft:#fbf1df;
  --shadow:0 4px 16px rgba(0,0,0,.08); --shadow-lg:0 12px 32px rgba(0,0,0,.12);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141517; --surface:#1e2023; --surface-2:#25282c; --border:#33363b; --text:#ececea; --muted:#9ba0a6;
  --accent:#6c9bf2; --accent-soft:#22314d; --danger:#f06b6b; --danger-soft:#3a2224; --success:#4fbf7a; --success-soft:#1d3326; --warning:#e0a24a; --warning-soft:#3a2f1c;
  --shadow:0 4px 16px rgba(0,0,0,.4); --shadow-lg:0 12px 32px rgba(0,0,0,.5);
}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:13px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:0 14px;height:36px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
button:hover{background:var(--surface-2)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.primary:hover{filter:brightness(1.06);background:var(--accent)}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{background:var(--surface-2)}
button.danger{color:var(--danger)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary:disabled{filter:none}
button.sm{height:30px;padding:0 10px;font-size:12px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select,textarea{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:0 10px;height:36px;min-width:0}
textarea{height:auto;padding:8px 10px;resize:vertical}
input.bad,select.bad{border-color:var(--danger)}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
a{color:var(--accent)}
[hidden]{display:none!important}
/* вход */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.lcard{width:360px;max-width:100%;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:24px}
.lcard h1{font-size:18px;margin:0 0 4px}.lcard p{color:var(--muted);margin:0 0 16px}
.fld{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.fld>span{font-size:12px;color:var(--muted)}
.fld .err{color:var(--danger);font-size:12px}
/* каркас */
#app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
nav{background:var(--surface);border-right:1px solid var(--border);padding:14px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
nav .brand{font-weight:600;padding:4px 10px 14px;display:flex;align-items:center;gap:8px}
nav .brand small{color:var(--muted);font-weight:500}
nav a{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;color:var(--text);text-decoration:none}
nav a:hover{background:var(--surface-2)}
nav a.on{background:var(--accent-soft);color:var(--accent)}
nav a .cnt{margin-left:auto;color:var(--muted);font-size:12px}
nav a .soon{margin-left:auto;font-size:10px;color:var(--muted);border:1px solid var(--border);border-radius:10px;padding:0 6px}
nav .sp{flex:1}
nav .me{border-top:1px solid var(--border);padding:10px;color:var(--muted);font-size:12px;display:flex;flex-direction:column;gap:6px}
nav .me div{display:flex;gap:6px}
main{padding:24px 28px 60px;min-width:0}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ph h2{margin:0;font-size:20px;font-weight:600}
.ph .sp{flex:1}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px;cursor:pointer;min-width:96px}
.stat b{display:block;font-size:18px;font-weight:600}
.stat span{color:var(--muted);font-size:12px}
.stat.on{border-color:var(--accent);background:var(--accent-soft)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input[type=search]{width:260px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px}
table{width:100%;border-collapse:collapse}
th{font-weight:500;color:var(--muted);font-size:12px;text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}
td .sub{color:var(--muted);font-size:12px}
.thumb{width:40px;height:40px;border-radius:8px;background:var(--surface-2);object-fit:cover;display:block}
.num{text-align:right;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:11px;font-weight:500;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--success-soft);color:var(--success)}
.badge.warn{background:var(--warning-soft);color:var(--warning)}
.badge.bad{background:var(--danger-soft);color:var(--danger)}
.badge.info{background:var(--accent-soft);color:var(--accent)}
.badge .ic{width:12px;height:12px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px 12px;color:var(--muted);font-size:12px}
.empty{padding:40px;text-align:center;color:var(--muted)}
/* карточка товара */
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.sec{padding:16px}
.sec h3{margin:0 0 4px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.sec h3 .n{width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.sec .hint{color:var(--muted);font-size:12px;margin:0 0 10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dims{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.unitin{display:flex;align-items:center;gap:6px}.unitin input{flex:1;width:100%}.unitin span{color:var(--muted);font-size:12px}
.seg{display:inline-flex;gap:2px;background:var(--surface-2);border-radius:8px;padding:2px;flex-wrap:wrap}
.seg button{height:30px;border:none;background:transparent;border-radius:6px;color:var(--muted);padding:0 12px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.drop{border:1px dashed var(--border);border-radius:10px;padding:18px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .ic{vertical-align:-4px}
.drop.dis{cursor:not-allowed;opacity:.6}
.callout{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;margin:10px 0;font-size:12.5px}
.callout .ic{margin-top:1px}
.callout.ok{background:var(--success-soft);color:var(--success)}
.callout.warn{background:var(--warning-soft);color:var(--warning)}
.callout.bad{background:var(--danger-soft);color:var(--danger)}
.callout.info{background:var(--accent-soft);color:var(--text)}
.callout.info .ic{color:var(--accent)}
.callout ul{margin:4px 0 0;padding-left:18px}
.cmp{width:100%;margin:8px 0;font-size:12.5px}
.cmp td,.cmp th{padding:6px 8px}
.cmp tbody tr{cursor:default}.cmp tbody tr:hover{background:none}
.kv{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:12px;margin:6px 0}
.kv b{color:var(--text);font-weight:500}
#viewer{width:100%;aspect-ratio:4/3;border-radius:10px;background:var(--surface-2);position:relative;overflow:hidden;margin:10px 0}
#viewer canvas{display:block;width:100%;height:100%}
#viewer .vlbl{position:absolute;left:10px;bottom:8px;font-size:11px;color:var(--muted)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:10px 0}
.img{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--border);aspect-ratio:1}
.img img{width:100%;height:100%;object-fit:cover;display:block}
.img .ia{position:absolute;left:4px;right:4px;bottom:4px;display:flex;gap:4px;justify-content:space-between}
.img .ia button{height:26px;width:26px;padding:0;justify-content:center;background:rgba(20,22,26,.65);color:#fff;border:none}
.img .main{position:absolute;left:6px;top:6px;font-size:10px;background:rgba(20,22,26,.65);color:#fff;border-radius:6px;padding:1px 6px}
.stickybar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0;margin:-12px 0 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stickybar h2{margin:0;font-size:20px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50vw}
.stickybar .sp{flex:1}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:40px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:6px;min-width:200px;z-index:10}
.menu button{width:100%;justify-content:flex-start;border:none;background:none}
.menu button:hover{background:var(--surface-2)}
.soonbox{padding:24px;max-width:720px}
.soonbox h3{margin:0 0 8px}
.soonbox ol{padding-left:20px;margin:8px 0}
.soonbox li{margin:4px 0}
/* диалог */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal .box{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);padding:20px;width:420px;max-width:100%}
#modal h3{margin:0 0 8px;font-size:16px}
#modal p{color:var(--muted);margin:0 0 14px}
#modal .btns{justify-content:flex-end}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:60;pointer-events:none}
.toast{background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;box-shadow:var(--shadow)}
.toast.err{background:var(--danger);color:#fff}
@media (max-width:980px){.pgrid{grid-template-columns:1fr}}
@media (max-width:760px){#app{grid-template-columns:1fr}nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:none;border-bottom:1px solid var(--border)}nav .sp,nav .me{display:none}nav .brand{width:100%;padding-bottom:6px}main{padding:16px}.toolbar input[type=search]{width:100%}.hide-sm{display:none}.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" hidden>
  <form class="lcard" id="loginForm">
    <h1>Админ‑панель</h1>
    <p>Каталог товаров платформы планировки</p>
    <label class="fld"><span>Почта</span><input name="email" type="email" autocomplete="username" required></label>
    <label class="fld"><span>Пароль</span><input name="password" type="password" autocomplete="current-password" required></label>
    <div class="fld"><span class="err" id="loginErr"></span></div>
    <button class="primary" style="width:100%;justify-content:center">Войти</button>
  </form>
</div>
<div id="app" hidden>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="modal" hidden><div class="box" role="dialog" aria-modal="true"></div></div>
<div id="toasts"></div>
<script>
'use strict';
/* =========================================================================
   Админ‑панель: каталог товаров. Роль admin. Разделы «Компании» и «Модерация»
   заложены под кабинет компании (ТЗ, раздел 68).
   ========================================================================= */
const $=s=>document.querySelector(s);
function h(tag,attrs={},...kids){const el=document.createElement(tag);for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==='class')el.className=v;else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);else if(k==='html')el.innerHTML=v;else el.setAttribute(k,v===true?'':v);}for(const c of kids.flat()){if(c==null||c===false)continue;el.append(c instanceof Node?c:document.createTextNode(String(c)));}return el;}
const ICONS={box:'<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
 building:'<path d="M4 21V5l8-2v18M12 7l8 2v12M8 8v1M8 12v1M8 16v1M16 12v1M16 16v1M2 21h20"/>',check:'<path d="M5 12l5 5 9-11"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
 list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1"/>',plus:'<path d="M12 5v14M5 12h14"/>',upload:'<path d="M12 16V4M6 10l6-6 6 6M4 20h16"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
 back:'<path d="M15 6l-6 6 6 6"/>',left:'<path d="M15 6l-6 6 6 6"/>',right:'<path d="M9 6l6 6-6 6"/>',alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17v1"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 8v1M12 11v5"/>',
 cube:'<path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 22V12M21 7l-9 5-9-5"/>',sparkles:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',dots:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
 logout:'<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"/>',key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3"/>',ext:'<path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/>',ruler:'<path d="M3 8h18M3 6v4M21 6v4M8 18h8M8 16v4M16 16v4"/>'};
function ic(n){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('class','ic');s.setAttribute('aria-hidden','true');s.innerHTML=ICONS[n]||ICONS.info;return s;}
function plural(n,a,b,c){const m=n%10,k=n%100;return n+' '+(m===1&&k!==11?a:m>=2&&m<=4&&(k<12||k>14)?b:c);}
function toast(msg,err){const t=h('div',{class:'toast'+(err?' err':'')},msg);$('#toasts').append(t);setTimeout(()=>t.remove(),err?4000:2500);}

/* ---------- API ---------- */
const S={token:null,user:null,stats:null,dirty:false,config:{uploads:'direct'}};
/* Загрузка файла: локально — прямо в API; на Vercel — из браузера в Vercel Blob (лимит функции 4,5 МБ), затем commit */
let blobClient=null;
async function loadBlobClient(){if(blobClient)return blobClient;
  for(const src of ['https://esm.sh/@vercel/blob/client','https://cdn.jsdelivr.net/npm/@vercel/blob/client/+esm']){try{blobClient=await import(src);if(blobClient.upload||blobClient.uploadPresigned)return blobClient;}catch(e){console.warn('blob client',src,e);}}
  throw new Error('Не удалось загрузить модуль загрузки файлов (@vercel/blob/client)');}
async function uploadFile(productId,kind,file,onProgress){
  if(S.config.uploads!=='blob'){
    const type=kind==='model'?'model/gltf-binary':file.type;
    return kind==='model'?api('PUT',`/admin/products/${productId}/model`,null,new Blob([await file.arrayBuffer()],{type})):api('POST',`/admin/products/${productId}/images`,null,new Blob([await file.arrayBuffer()],{type}));
  }
  const bc=await loadBlobClient();
  const presigned=S.config.blobAuth==='oidc';            // OIDC‑store: presigned‑загрузка; со статическим токеном — обычная
  const upload=presigned?bc.uploadPresigned:bc.upload;
  if(typeof upload!=='function')throw new Error('Модуль загрузки файлов устарел (нет '+(presigned?'uploadPresigned':'upload')+')');
  const ext=(file.name.match(/\.[a-z0-9]+$/i)||[''])[0].toLowerCase();
  const pathname=`products/${productId}/${kind==='model'?'model':'img'}-${Date.now()}${ext}`;
  let blob;
  try{blob=await upload(pathname,file,{access:'public',handleUploadUrl:'/api/admin/blob-upload',clientPayload:JSON.stringify({token:S.token,productId,kind}),
    contentType:kind==='model'?'model/gltf-binary':file.type,multipart:file.size>8*1048576,onUploadProgress:onProgress?(e=>onProgress(e.percentage)):undefined});}
  catch(e){throw new Error('Загрузка в хранилище не удалась: '+(e.message||e));}
  return api('POST',`/admin/products/${productId}/${kind==='model'?'model':'images'}/commit`,{url:blob.url});
}
try{S.token=localStorage.getItem('admin.token');}catch(e){}
async function api(method,path,body,raw){
  const hd={};if(S.token)hd.Authorization='Bearer '+S.token;
  let b;if(raw){b=raw;hd['Content-Type']=raw.type||'application/octet-stream';}else if(body!==undefined){b=JSON.stringify(body);hd['Content-Type']='application/json';}
  let r;try{r=await fetch('api'+path,{method,headers:hd,body:b});}catch(e){throw Object.assign(new Error('Сервер недоступен'),{code:'network'});}
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&path!=='/auth/login'){logoutLocal();throw Object.assign(new Error('Сессия истекла — войдите снова'),{code:'unauthorized'});}
  if(!r.ok)throw Object.assign(new Error(j.error?.message||('Ошибка '+r.status)),{code:j.error?.code,details:j.error?.details,status:r.status});
  return j;
}
function logoutLocal(){S.token=null;S.user=null;try{localStorage.removeItem('admin.token');}catch(e){}showLogin();}

/* ---------- справочники ---------- */
const CAT_NAME=Object.fromEntries(CATS);
const STATUS={draft:['Черновик',''],review:['На модерации','info'],published:['Опубликован','ok'],rejected:['Отклонён','bad'],archived:['В архиве','']};
const MODEL={none:['Нет 3D',''],ready:['3D готова','ok'],mismatch:['3D: размеры не совпадают','bad'],generating:['3D генерируется','info'],failed:['3D: ошибка','bad']};
const SOURCE={admin:'Платформа',company:'Компания',demo:'Демо'};
const CURRENCIES=['USD','EUR','RUB','BYN','KZT','UAH','GBP'];
const badge=(map,k)=>{const [t,c]=map[k]||[k,''];return h('span',{class:'badge '+c},t);};
const fmtMoney=(v,c)=>(v||0).toLocaleString('ru',{maximumFractionDigits:2})+' '+c;
const fmtDate=s=>{const d=new Date(s);return d.toLocaleDateString('ru',{day:'2-digit',month:'2-digit',year:'2-digit'})+' '+d.toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});};
const dimsText=(p)=>{const t=TYPE.get(p.typeId);if(!t)return '';const fo=formOf(t,p.formId);return formDimKeys(fo).filter(k=>k!=='E').map(k=>p.dims[k]??'—').join('×')+' мм';};
const typeOptions=(sel)=>CATS.map(([cid,cn])=>h('optgroup',{label:cn},...TYPES.filter(t=>t.cats[0]===cid).map(t=>h('option',{value:t.id,selected:t.id===sel},t.name))));

/* ---------- вход ---------- */
function showLogin(){$('#app').hidden=true;$('#login').hidden=false;setTimeout(()=>$('#loginForm').email.focus(),0);}
$('#loginForm').onsubmit=async e=>{e.preventDefault();const f=e.target;$('#loginErr').textContent='';
  try{const r=await api('POST','/auth/login',{email:f.email.value,password:f.password.value});
    if(r.user.role!=='admin'){$('#loginErr').textContent='Нет доступа к админ‑панели';return;}
    S.token=r.token;S.user=r.user;try{localStorage.setItem('admin.token',r.token);}catch(e){}f.password.value='';start();
  }catch(err){$('#loginErr').textContent=err.message;}};

async function start(){
  if(!S.token)return showLogin();
  try{const r=await api('GET','/auth/me');S.user=r.user;if(S.user.role!=='admin'){logoutLocal();return;}}catch(e){if(e.code!=='unauthorized'){$('#loginErr').textContent=e.message;showLogin();}return;}
  try{S.config=await api('GET','/config');}catch(e){}
  $('#login').hidden=true;$('#app').hidden=false;await refreshStats();route();
}

  async function uploadModel(file){

    const st=h('div',{class:'drop dis'},'Загрузка и проверка модели…');secModel.querySelector('.drop,.btns')?.replaceWith(st);
    try{p=await uploadFile(p.id,'model',file,pc=>{st.textContent=pc<100?`Загрузка ${Math.round(pc)} %…`:'Проверка модели…';});p.publishProblems=(await api('GET','/admin/products/'+p.id)).publishProblems;
      toast(p.model.status==='ready'?'Модель загружена, размеры совпадают':'Модель загружена, но размеры не совпадают',p.model.status!=='ready');await refreshStats();}
    catch(e){toast(e.message,true);}
    renderModel();renderProblems();}
  async function delModel(){if(!(await confirmDlg('Удалить 3D‑модель?','В редакторе вместо неё будет типовой предмет по размерам.','Удалить',true)))return;try{p=await api('DELETE',`/admin/products/${p.id}/model`);await refreshStats();}catch(e){toast(e.message,true);}renderModel();}
  async function fitDims(){if(!(await confirmDlg('Взять размеры из модели?','Размеры товара будут заменены габаритами модели. Проверьте, что модель в правильном масштабе.','Заменить')))return;
    try{p=await api('POST',`/admin/products/${p.id}/model/fit-dims`);f.dims={...p.dims};renderDims();p.publishProblems=(await api('GET','/admin/products/'+p.id)).publishProblems;toast('Размеры обновлены');await refreshStats();}catch(e){toast(e.message,true);}renderModel();renderProblems();}
  async function genModel(){try{await api('POST',`/admin/products/${p.id}/model/generate`);}catch(e){toast(e.message,e.code!=='not_implemented');}}

  function renderImages(){
    secImg.replaceChildren(h('h3',{},h('span',{class:'n'},'4'),'Фото'),h('p',{class:'hint'},'JPG, PNG или WebP до 15 МБ, до 10 фото. Первое — главное: его видно в каталоге. Фото на белом фоне лучше всего подходят для ИИ‑подбора.'));

      h('div',{class:'ia'},h('span',{},h('button',{title:'Раньше','aria-label':'Раньше',disabled:i===0,onclick:()=>moveImg(im.id,-1)},ic('left')),' ',h('button',{title:'Позже','aria-label':'Позже',disabled:i===imgs.length-1,onclick:()=>moveImg(im.id,1)},ic('right'))),h('button',{title:'Удалить','aria-label':'Удалить',onclick:()=>delImg(im.id)},ic('trash')))))));
    if(imgs.length<10)secImg.append(dropZone('image/jpeg,image/png,image/webp','Перетащите фото сюда или нажмите, чтобы выбрать',addImages,true));

  async function addImages(files){for(const file of files){if(file.size>15*1048576){toast(`${file.name}: больше 15 МБ`,true);continue;}try{p.images=(await uploadFile(p.id,'image',file)).images;}catch(e){toast(`${file.name}: ${e.message}`,true);}}renderImages();}

function pick(accept,cb,multiple){const i=h('input',{type:'file',accept,multiple:!!multiple});i.onchange=()=>{if(i.files.length)cb(multiple?[...i.files]:i.files[0]);};i.click();}
function dropZone(accept,label,cb,multiple){const d=h('div',{class:'drop',tabindex:'0',role:'button'},ic('upload'),' ',label);
  d.onclick=()=>pick(accept,cb,multiple);d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();d.click();}};
  d.ondragover=e=>{e.preventDefault();d.classList.add('over');};d.ondragleave=()=>d.classList.remove('over');
  d.ondrop=e=>{e.preventDefault();d.classList.remove('over');const fs=[...e.dataTransfer.files];if(fs.length)cb(multiple?fs:fs[0]);};return d;}

/* ---------- 3D‑просмотр модели (three.js грузится по требованию) ---------- */
let threeReady=null;
function loadThree(){if(threeReady)return threeReady;const add=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.append(s);});
  threeReady=add('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js').then(()=>Promise.all([add('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js'),add('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js')]));return threeReady;}
let viewerStop=null;
async function initViewer(el,url,p){
  if(viewerStop){viewerStop();viewerStop=null;}
  try{await loadThree();}catch(e){el.append(h('div',{class:'empty'},'Просмотр недоступен: не загрузилась библиотека three.js'));return;}
  const W=el.clientWidth,H=el.clientHeight;const r=new THREE.WebGLRenderer({antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(W,H);r.outputEncoding=THREE.sRGBEncoding;el.prepend(r.domElement);
  const sc=new THREE.Scene();sc.add(new THREE.HemisphereLight(0xffffff,0x888888,1.1));const dl=new THREE.DirectionalLight(0xffffff,0.8);dl.position.set(3,5,4);sc.add(dl);
  const cam=new THREE.PerspectiveCamera(40,W/H,0.01,100);const ctl=new THREE.OrbitControls(cam,r.domElement);ctl.enableDamping=true;
  const t=TYPE.get(p.typeId),fo=formOf(t,p.formId),e=footprintExtents(fo.fp,p.dims);const ew=e.w/1000,ed=e.d/1000,eh=(p.dims.H||500)/1000;
  const frame=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(ew,eh,ed)),new THREE.LineBasicMaterial({color:0x2f6fe4}));frame.position.y=eh/2;sc.add(frame);
  const grid=new THREE.GridHelper(Math.max(ew,ed)*2.2,22,0x999999,0xcccccc);sc.add(grid);
  const arrow=new THREE.ArrowHelper(new THREE.Vector3(0,0,1),new THREE.Vector3(0,0.002,ed/2),Math.max(0.25,ed*0.5),0xd64545,0.08,0.05);sc.add(arrow);
  const size=Math.max(ew,ed,eh);cam.position.set(size*1.4,size*1.1,size*1.8);ctl.target.set(0,eh/2,0);ctl.update();
  new THREE.GLTFLoader().load(url,g=>{sc.add(g.scene);},undefined,()=>{el.append(h('div',{class:'empty'},'Не удалось показать модель'));});
  let alive=true;const loop=()=>{if(!alive||!el.isConnected){alive=false;r.dispose();return;}ctl.update();r.render(sc,cam);requestAnimationFrame(loop);};loop();
  viewerStop=()=>{alive=false;};
}
