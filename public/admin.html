<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b">
<title>Админ‑панель — Планировка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="shared/ui.css">
<script src="shared/catalog-types.js"></script>
<style>
/* ================= Админ‑панель: раскладка ================= */
body{min-height:100dvh}
.logo{width:28px;height:28px;border-radius:var(--radius-md);background:var(--primary);color:var(--primary-foreground);display:inline-flex;align-items:center;justify-content:center;flex:none}
.logo .ic{width:16px;height:16px}
.brandmark{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-.01em}
.brandmark small{display:block;font-size:12px;font-weight:400;color:var(--muted-foreground);letter-spacing:0}

/* ---------- вход ---------- */
#login{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px 16px calc(24px + var(--safe-bottom));background:var(--sidebar)}
.lcard{width:100%;max-width:384px;padding:24px;display:flex;flex-direction:column;gap:20px}
.lcard .lhead h1{font-size:20px;font-weight:600;letter-spacing:-.01em;margin:0}
.lcard .lhead p{color:var(--muted-foreground);margin:6px 0 0;font-size:14px}
.lcard .fields{display:flex;flex-direction:column;gap:16px}
.lcard input{width:100%}
.lcard button[type=submit]{width:100%}
.lcard .err{min-height:0}
.lfoot{font-size:13px;color:var(--muted-foreground);text-align:center;max-width:384px}
.lfoot a{text-underline-offset:4px}

/* ---------- каркас ---------- */
#app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100dvh}
#sidebar{position:sticky;top:0;height:100dvh;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0;z-index:60}
#nav{display:flex;flex-direction:column;flex:1;min-height:0;padding:12px 8px calc(12px + var(--safe-bottom))}
#nav .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;text-decoration:none}
#nav .grp{padding:14px 8px 6px;font-size:12px;font-weight:500;color:var(--muted-foreground)}
#nav .grp:first-of-type{padding-top:4px}
#nav a.item{display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border-radius:var(--radius-md);color:var(--foreground);text-decoration:none;font-size:14px;transition:background-color .15s}
#nav a.item .ic{color:var(--muted-foreground)}
#nav a.item:hover{background:var(--accent)}
#nav a.item.on{background:var(--accent);font-weight:500}
#nav a.item.on .ic{color:var(--foreground)}
#nav a.item .cnt{margin-left:auto;color:var(--muted-foreground);font-size:12px;font-variant-numeric:tabular-nums}
#nav a.item .soon{margin-left:auto;font-size:11px;font-weight:500;color:var(--muted-foreground);border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 6px;line-height:18px}
#nav .sp{flex:1}
#nav .me{display:flex;flex-direction:column;gap:8px;padding:10px 8px 2px;border-top:1px solid var(--border);margin-top:8px}
#nav .me .who{display:flex;align-items:center;gap:10px;min-width:0}
#nav .me .ava{width:32px;height:32px;border-radius:var(--radius-md);background:var(--muted);color:var(--foreground);display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none;text-transform:uppercase}
#nav .me .em{min-width:0;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#nav .me .em small{display:block;font-weight:400;color:var(--muted-foreground);font-size:12px}
#nav .me .acts{display:flex;gap:6px}
#nav .me .acts button{flex:1}
#topbar{display:none}
#scrim{display:none}
main{padding:28px 32px 64px;min-width:0;width:100%;max-width:1440px}

/* ---------- заголовок страницы ---------- */
.ph{display:flex;align-items:flex-end;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.ph .tt{min-width:0;flex:1 1 280px}
.ph h2{margin:0;font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.25}
.ph .desc{margin:4px 0 0;color:var(--muted-foreground);font-size:14px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- сводка ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:20px}
button.stat{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:6px;height:auto;padding:14px 16px;border-radius:var(--radius-xl);background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow-sm);text-align:left;white-space:normal}
button.stat:hover{background:var(--card);border-color:color-mix(in srgb,var(--foreground) 22%,var(--border))}
button.stat span{color:var(--muted-foreground);font-size:13px;font-weight:500;line-height:1.2}
button.stat b{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
button.stat.on{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary),var(--shadow-sm)}

/* ---------- фильтры ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.search{position:relative;flex:0 1 300px;min-width:200px}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted-foreground);pointer-events:none}
.search input{width:100%;padding-left:34px}
.toolbar select{flex:0 1 auto;max-width:220px}
.toolbar .reset{margin-left:auto}

/* ---------- таблица (Table) ---------- */
.tcard{overflow-x:auto;overscroll-behavior-x:contain}
.show-sm{display:none}
@media (max-width:1279px){.hide-md{display:none}}
table{width:100%;border-collapse:collapse;font-size:14px}
th{height:40px;padding:0 12px;text-align:left;font-weight:500;color:var(--muted-foreground);font-size:13px;white-space:nowrap;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--muted) 45%,transparent)}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr{transition:background-color .12s}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover{background:color-mix(in srgb,var(--muted) 55%,transparent)}
tbody tr:last-child td{border-bottom:none}
td .sub{color:var(--muted-foreground);font-size:13px}
td.sub,.sub{color:var(--muted-foreground)}
td .nm{font-weight:500}
a.rowlink{color:inherit;text-decoration:none;font-weight:500}
a.rowlink:hover{text-decoration:underline;text-underline-offset:4px}
.thumb{width:40px;height:40px;border-radius:var(--radius-md);background:var(--muted);object-fit:cover;display:flex;align-items:center;justify-content:center;color:var(--muted-foreground)}
.thumb .ic{width:18px;height:18px}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.pager{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;color:var(--muted-foreground);font-size:13px;border-top:1px solid var(--border)}
.pager .pg{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.empty{padding:48px 24px;text-align:center;color:var(--muted-foreground);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .ic{width:24px;height:24px}
.empty b{color:var(--foreground);font-weight:600;font-size:15px}

/* ---------- карточка товара ---------- */
.stickybar{position:sticky;top:0;z-index:20;margin:-28px -32px 20px;padding:12px 32px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:color-mix(in srgb,var(--background) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.stickybar h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto}
.stickybar .sp{flex:1}
.backlnk{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--radius-md);color:var(--foreground);flex:none;margin-left:-6px}
.backlnk:hover{background:var(--accent)}
.stickybar .bact{display:flex;gap:8px;align-items:center}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.pcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.sec{padding:20px 24px 24px;display:flex;flex-direction:column;gap:14px}
.sec h3{margin:0;font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
.sec h3 .n{width:24px;height:24px;border-radius:50%;border:1px solid var(--border);color:var(--muted-foreground);font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex:none}
.sec h3 .end{margin-left:auto}
.sec .hint{color:var(--muted-foreground);font-size:14px;margin:-8px 0 0;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dims{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.dims .fld>span:first-child{font-size:13px}
.ig{display:flex;align-items:stretch;border:1px solid var(--input);border-radius:var(--radius-md);background:var(--field);box-shadow:var(--shadow-xs);transition:border-color .15s,box-shadow .15s}
.ig:focus-within{border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 50%,transparent)}
.ig input,.ig select{border:none;box-shadow:none!important;background-color:transparent;flex:1;min-width:0;width:100%}
.ig .sfx{display:flex;align-items:center;padding:0 12px 0 0;color:var(--muted-foreground);font-size:13px}
.ig select{flex:0 0 auto;width:auto;border-left:1px solid var(--input);border-radius:0 var(--radius-md) var(--radius-md) 0}
.ig:has(input.bad){border-color:var(--destructive)}
details.more{border-top:1px solid var(--border);padding-top:4px}
details.more summary{cursor:pointer;font-size:14px;font-weight:500;padding:8px 0;list-style:none;display:flex;align-items:center;gap:8px;border-radius:var(--radius-sm)}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:'';width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin:0 4px 0 2px}
details.more[open] summary::before{transform:rotate(45deg)}
details.more .fld{margin-top:12px}
.seg{flex-wrap:wrap;height:auto;min-height:36px}
.seg button{height:30px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1.5px dashed var(--border);border-radius:var(--radius-lg);padding:28px 16px;text-align:center;color:var(--muted-foreground);cursor:pointer;font-size:14px;transition:background-color .15s,border-color .15s}
.drop .ic{width:20px;height:20px}
.drop b{color:var(--foreground);font-weight:500}
.drop:hover{background:var(--accent)}
.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop.dis{cursor:not-allowed;opacity:.7}
.drop.dis:hover{background:none}
.cmp{width:100%;font-size:13px;border:1px solid var(--border);border-radius:var(--radius-lg);border-collapse:separate;border-spacing:0;overflow:hidden}
.cmp td,.cmp th{padding:8px 10px}
.cmp th{height:34px}
.kv{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted-foreground);font-size:13px}
.kv b{color:var(--foreground);font-weight:500;font-variant-numeric:tabular-nums}
#viewer{width:100%;aspect-ratio:4/3;border-radius:var(--radius-lg);background:var(--muted);position:relative;overflow:hidden;border:1px solid var(--border)}
#viewer canvas{display:block;width:100%;height:100%;touch-action:none}
#viewer .vlbl{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--muted-foreground);background:color-mix(in srgb,var(--background) 80%,transparent);padding:2px 8px;border-radius:var(--radius-sm)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.img{position:relative;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border);aspect-ratio:1;background:var(--muted)}
.img img{width:100%;height:100%;object-fit:cover;display:block}
.img .ia{position:absolute;left:6px;right:6px;bottom:6px;display:flex;gap:4px;justify-content:space-between}
.img .ia span{display:flex;gap:4px}
.img .ia button{height:28px;width:28px;padding:0;background:rgba(9,9,11,.7);color:#fff;border:none;box-shadow:none;border-radius:var(--radius-sm)}
.img .ia button:hover{background:rgba(9,9,11,.9);color:#fff}
.img .ia button:disabled{opacity:.35}
.img .main{position:absolute;left:6px;top:6px;font-size:11px;font-weight:500;background:rgba(9,9,11,.7);color:#fff;border-radius:var(--radius-sm);padding:2px 6px}
.menuwrap{position:relative}
.menuwrap .dmenu{position:absolute;right:0;top:42px;z-index:30;transform-origin:top right}
.soonbox{padding:24px;max-width:760px;display:flex;flex-direction:column;gap:10px}
.soonbox h3{margin:0;font-size:16px;font-weight:600}
.soonbox p{margin:0;line-height:1.6}
.soonbox ol{padding-left:20px;margin:0;line-height:1.6}
.soonbox .hint{color:var(--muted-foreground)}

/* ---------- диалог (AlertDialog) ---------- */
#modal{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;z-index:80;padding:16px;animation:fade-in .15s ease-out;overscroll-behavior:contain}
#modal .box{background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);padding:24px;width:448px;max-width:100%;max-height:calc(100dvh - 32px);overflow:auto;display:flex;flex-direction:column;gap:16px;animation:pop-in .15s var(--ease)}
#modal h3{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
#modal p{color:var(--muted-foreground);margin:-8px 0 0;line-height:1.5}
#modal .btns{justify-content:flex-end}

/* ================= Планшеты: боковое меню — выдвижная панель ================= */
@media (max-width:1023px){
  #app{grid-template-columns:minmax(0,1fr)}
  #topbar{display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:40;height:calc(56px + var(--safe-top));padding:var(--safe-top) calc(12px + var(--safe-right)) 0 calc(8px + var(--safe-left));
    background:color-mix(in srgb,var(--background) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
  #topbar .brandmark{font-size:14px}
  #topbar .sp{flex:1}
  #sidebar{position:fixed;left:0;top:0;bottom:0;height:100dvh;width:min(288px,86vw);transform:translateX(-102%);transition:transform .22s var(--ease);box-shadow:var(--shadow-lg);visibility:hidden}
  body.nav-open #sidebar{transform:none;visibility:visible}
  #nav{padding-top:calc(12px + var(--safe-top))}
  #scrim{position:fixed;inset:0;background:var(--overlay);z-index:55;animation:fade-in .15s ease-out}
  body.nav-open #scrim{display:block}
  body.nav-open{overflow:hidden}
  main{padding:20px 20px 56px}
  .stickybar{top:calc(56px + var(--safe-top));margin:-20px -20px 16px;padding:10px 20px}
  .pgrid{grid-template-columns:minmax(0,1fr)}
}

/* ================= Телефоны ================= */
@media (max-width:767px){
  main{padding:16px calc(16px + var(--safe-right)) calc(48px + var(--safe-bottom)) calc(16px + var(--safe-left))}
  .ph{margin-bottom:16px}
  .ph h2{font-size:22px}
  .ph .acts{width:100%}
  .ph .acts button{flex:1}
  .stats{display:flex;overflow-x:auto;gap:8px;margin:0 -16px 16px;padding:2px 16px 6px;scroll-snap-type:x proximity;scrollbar-width:none}
  .stats::-webkit-scrollbar{display:none}
  .stats button.stat{flex:0 0 128px;scroll-snap-align:start}
  button.stat{padding:10px 12px;gap:4px;border-radius:var(--radius-lg)}
  button.stat b{font-size:20px}
  button.stat span{font-size:12px}
  .toolbar{display:grid;grid-template-columns:1fr 1fr}
  .search{grid-column:1/-1;flex:none;min-width:0}
  .toolbar select{max-width:none;width:100%}
  /* таблица товаров — карточки */
  .ptable thead{display:none}
  .ptable,.ptable tbody{display:block}
  .ptable tr{display:grid;grid-template-columns:44px minmax(0,1fr) auto;grid-template-areas:"t n p" "t m s";column-gap:12px;row-gap:6px;padding:12px;border-bottom:1px solid var(--border);align-items:center}
  .ptable tr:last-child{border-bottom:none}
  .ptable td{padding:0;border:none;min-width:0}
  .ptable td.hide-sm{display:none}
  .ptable td.c-t{grid-area:t;align-self:start}
  .ptable td.c-n{grid-area:n}
  .ptable td.c-p{grid-area:p;font-weight:500}
  .ptable td.c-m{grid-area:m}
  .ptable td.c-s{grid-area:s;justify-self:end}
  .ptable .thumb{width:44px;height:44px}
  .ptable td.c-n .nm,.ptable td.c-n a,.ptable td.c-n .sub{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .show-sm{display:inline}
  .hide-sm{display:none}
  .stickybar{margin:-16px -16px 16px;padding:10px 16px}
  .stickybar h2{font-size:17px;flex:1 1 0}
  .stickybar .sp{display:none}
  .stickybar .bact{width:100%;order:10}
  .stickybar .bact>.btns{flex:1}
  .stickybar .bact>.btns button,.stickybar .bact>button.primary{flex:1}
  .sec{padding:16px}
  .row2{grid-template-columns:1fr}
  .dims{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kv{gap:4px 12px}
  #modal{align-items:flex-end;padding:0}
  #modal .box{width:100%;border-radius:var(--radius-xl) var(--radius-xl) 0 0;padding:20px 16px calc(16px + var(--safe-bottom));animation:sheet-up .22s var(--ease)}
  #modal .btns{flex-direction:column-reverse}
  #modal .btns button{width:100%}
  .pager{flex-wrap:wrap}
}
</style>
</head>
<body>
<div id="login" hidden>
  <div class="brandmark"><span class="logo"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 22V12M21 7l-9 5-9-5"/></svg></span>Планировка</div>
  <form class="card lcard" id="loginForm" novalidate>
    <div class="lhead"><h1>Вход в админ‑панель</h1><p>Каталог товаров платформы планировки</p></div>
    <div class="fields">
      <label class="fld"><span>Почта</span><input name="email" type="email" autocomplete="username" inputmode="email" spellcheck="false" placeholder="admin@company.com" required></label>
      <label class="fld"><span>Пароль</span><input name="password" type="password" autocomplete="current-password" required></label>
      <div class="err" id="loginErr" role="alert"></div>
    </div>
    <button type="submit" class="primary" id="loginBtn">Войти</button>
  </form>
  <p class="lfoot">Забыли пароль? Задайте новый в переменной <code translate="no">ADMIN_PASSWORD</code> и пересоберите проект.</p>
</div>
<div id="app" hidden>
  <header id="topbar">
    <button class="ghost iconbtn" id="navBtn" aria-label="Открыть меню" aria-controls="sidebar" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="brandmark"><span class="logo"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 22V12M21 7l-9 5-9-5"/></svg></span>Планировка</div>
    <span class="sp"></span>
  </header>
  <aside id="sidebar" aria-label="Разделы"><nav id="nav"></nav></aside>
  <div id="scrim"></div>
  <main id="main"></main>
</div>
<div id="modal" hidden><div class="box" role="alertdialog" aria-modal="true"></div></div>
<div id="toasts" role="status" aria-live="polite"></div>
<script>
'use strict';
/* =========================================================================
   Админ‑панель: каталог товаров. Роль admin. Разделы «Компании» и «Модерация»
   заложены под кабинет компании (ТЗ, раздел 68).
   ========================================================================= */
const $=s=>document.querySelector(s);
function h(tag,attrs={},...kids){const el=document.createElement(tag);for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==='class')el.className=v;else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);else if(k==='html')el.innerHTML=v;else el.setAttribute(k,v===true?'':v);}for(const c of kids.flat()){if(c==null||c===false)continue;el.append(c instanceof Node?c:document.createTextNode(String(c)));}return el;}

/* Загрузка файла: локально — прямо в API; на Vercel — из браузера в Vercel Blob (лимит функции 4,5 МБ), затем commit */
let blobClient=null;
async function loadBlobClient(){if(blobClient)return blobClient;
  for(const src of ['https://esm.sh/@vercel/blob/client','https://cdn.jsdelivr.net/npm/@vercel/blob/client/+esm']){try{blobClient=await import(src);if(blobClient.upload||blobClient.uploadPresigned)return blobClient;}catch(e){console.warn('blob client',src,e);}}
  throw new Error('Не удалось загрузить модуль загрузки файлов (@vercel/blob/client)');}
async function uploadFile(productId,kind,file,onProgress){
  if(S.config.uploads!=='blob'){
    const type=kind==='model'?'model/gltf-binary':file.type;
    return kind==='model'?api('PUT',`/admin/products/${productId}/model`,null,new Blob([await file.arrayBuffer()],{type})):api('POST',`/admin/products/${productId}/images`,null,new Blob([await file.arrayBuffer()],{type}));
  }
  const bc=await loadBlobClient();
  const presigned=S.config.blobAuth==='oidc';            // OIDC‑store: presigned‑загрузка; со статическим токеном — обычная
  const upload=presigned?bc.uploadPresigned:bc.upload;
  if(typeof upload!=='function')throw new Error('Модуль загрузки файлов устарел (нет '+(presigned?'uploadPresigned':'upload')+')');
  const ext=(file.name.match(/\.[a-z0-9]+$/i)||[''])[0].toLowerCase();
  const pathname=`products/${productId}/${kind==='model'?'model':'img'}-${Date.now()}${ext}`;
  let blob;
  try{blob=await upload(pathname,file,{access:'public',handleUploadUrl:'/api/admin/blob-upload',clientPayload:JSON.stringify({token:S.token,productId,kind}),
    contentType:kind==='model'?'model/gltf-binary':file.type,multipart:file.size>8*1048576,onUploadProgress:onProgress?(e=>onProgress(e.percentage)):undefined});}
  catch(e){throw new Error('Загрузка в хранилище не удалась: '+(e.message||e));}
  return api('POST',`/admin/products/${productId}/${kind==='model'?'model':'images'}/commit`,{url:blob.url});
}
try{S.token=localStorage.getItem('admin.token');}catch(e){}
async function api(method,path,body,raw){
  const hd={};if(S.token)hd.Authorization='Bearer '+S.token;
  let b;if(raw){b=raw;hd['Content-Type']=raw.type||'application/octet-stream';}else if(body!==undefined){b=JSON.stringify(body);hd['Content-Type']='application/json';}
  let r;try{r=await fetch('api'+path,{method,headers:hd,body:b});}catch(e){throw Object.assign(new Error('Сервер недоступен'),{code:'network'});}
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&path!=='/auth/login'){logoutLocal();throw Object.assign(new Error('Сессия истекла — войдите снова'),{code:'unauthorized'});}
  if(!r.ok)throw Object.assign(new Error(j.error?.message||('Ошибка '+r.status)),{code:j.error?.code,details:j.error?.details,status:r.status});
  return j;
}

  if(!f.password.value){f.password.setAttribute('aria-invalid','true');$('#loginErr').textContent='Введите пароль';f.password.focus();return;}
