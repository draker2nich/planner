<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Планировка — редактор комнаты</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="shared/catalog-types.js"></script>
<style>
:root{
  --bg:#f5f5f3; --surface:#ffffff; --surface-2:#f0f0ee; --border:#e3e3df; --text:#1a1b1e; --muted:#6f7378;
  --accent:#2f6fe4; --accent-soft:#e7eefc; --danger:#d64545; --success:#2e9e5b; --locked:#9ba0a6; --warning:#d9922b;
  --grid:#ecece8; --grid-strong:#dcdcd6; --wall:#26282c; --wall-fill:#b9b7b0; --dim-active:#2f6fe4; --dim-idle:rgba(111,115,120,.45);
  --shadow:0 4px 16px rgba(0,0,0,.08); --shadow-lg:0 12px 32px rgba(0,0,0,.12);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  /* совместимость со старыми именами */
  --paper:var(--surface); --fg:var(--text); --line:var(--border); --card:var(--surface); --ok:var(--success);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141517; --surface:#1e2023; --surface-2:#25282c; --border:#33363b; --text:#ececea; --muted:#9ba0a6;
  --accent:#6c9bf2; --accent-soft:#22314d; --danger:#f06b6b; --success:#4fbf7a; --locked:#7b8087; --warning:#e0a24a;
  --grid:#202226; --grid-strong:#2a2d32; --wall:#e8e8e4; --wall-fill:#5c6068; --dim-active:#6c9bf2; --dim-idle:rgba(155,160,166,.45);
  --shadow:0 4px 16px rgba(0,0,0,.4); --shadow-lg:0 12px 32px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#141517; --surface:#1e2023; --surface-2:#25282c; --border:#33363b; --text:#ececea; --muted:#9ba0a6;
  --accent:#6c9bf2; --accent-soft:#22314d; --danger:#f06b6b; --success:#4fbf7a; --locked:#7b8087; --warning:#e0a24a;
  --grid:#202226; --grid-strong:#2a2d32; --wall:#e8e8e4; --wall-fill:#5c6068; --dim-active:#6c9bf2; --dim-idle:rgba(155,160,166,.45);
  --shadow:0 4px 16px rgba(0,0,0,.4); --shadow-lg:0 12px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:0 14px;height:36px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
button:hover{background:var(--surface-2)}
button:active{background:var(--accent-soft)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.primary:hover{filter:brightness(1.06);background:var(--accent)}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{background:var(--surface-2)}
button.danger{color:var(--danger)}
button:disabled{opacity:.4;cursor:not-allowed;background:var(--surface)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button svg,.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
input,select,textarea{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:0 10px;height:36px;min-width:0}
textarea{height:auto;padding:8px 10px;resize:vertical}
input[readonly]{color:var(--muted);background:var(--surface-2)}
input[type=range]{height:auto;padding:0;border:none;background:transparent;accent-color:var(--accent)}
input[type=checkbox]{width:16px;height:16px;height:auto;accent-color:var(--accent)}
input[type=color]{padding:2px;width:36px}
#app{display:grid;grid-template-rows:52px 1fr;height:100%}
header{display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--border);background:var(--surface);position:relative;z-index:30}
header .name{font-weight:600;border-color:transparent;background:transparent;width:200px;padding:0 8px}
header .name:hover,header .name:focus{border-color:var(--border);background:var(--surface)}
header .sp{flex:1}
header .save{color:var(--muted);font-size:12px;min-width:110px;text-align:right}
header .only3d{display:none}
body.in3d header .hide3d{display:none}
body.in3d header .only3d{display:inline-flex;align-items:center;gap:8px}
header label{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
header input[type=range]{width:120px}
.iconbtn{width:36px;padding:0;justify-content:center}
header .iconbtn{color:var(--muted);position:relative;flex:none}
header .iconbtn:hover{color:var(--text)}
header .iconbtn.on{background:var(--accent-soft);color:var(--accent)}
header .iconbtn:disabled{background:transparent}
.hsep{width:1px;height:20px;background:var(--border);flex:none}
#btnLock .pdot{position:absolute;right:6px;top:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
#tip{position:fixed;z-index:80;background:var(--text);color:var(--bg);font-size:12px;padding:5px 9px;border-radius:6px;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow)}
#menu .mi .chk{margin-left:auto;color:var(--accent)}
#menu .mh{padding:6px 10px 2px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
@media (max-width:1100px){header .name{width:140px}}
@media (max-width:899px){header .vw,header .save{display:none!important}}
/* шаг 2 брифа */
.pcard .pc-err{color:var(--danger);font-size:12px;margin-top:4px}
.fld-lbl{font-size:12px;color:var(--muted);margin:12px 0 4px}
textarea.bad{border-color:var(--danger)}
#dlg textarea{width:100%;display:block}
.stline{color:var(--muted);font-size:12px;margin-top:8px}
.infoblk{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:10px;background:var(--accent-soft);color:var(--text);margin:8px 0}
.infoblk svg{color:var(--accent);margin-top:1px}
.aitable .hd .rst{height:26px;font-size:12px;padding:0 8px;border:none;background:transparent;color:var(--accent);text-decoration:underline}
#menuWrap{position:relative}
#menu{position:absolute;left:0;top:42px;width:260px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;z-index:40}
#menu .mi{display:flex;align-items:center;gap:10px;width:100%;height:36px;border:none;background:none;border-radius:8px;padding:0 10px;justify-content:flex-start}
#menu .mi:hover{background:var(--surface-2)}
#menu .mi.danger{color:var(--danger)}
#menu .sub{display:flex;gap:4px;padding:4px 10px 8px 38px;flex-wrap:wrap}
#menu .sub button{height:28px;padding:0 10px;font-size:12px}
#menu .sub button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#menu hr{border:none;border-top:1px solid var(--border);margin:6px 4px}
.segc{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:2px;gap:2px}
.segc button{height:32px;border:none;background:transparent;border-radius:6px;padding:0 12px;color:var(--muted)}
.segc button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.segc button:disabled{opacity:.4}
main{position:relative;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:default}
#tools{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px;box-shadow:var(--shadow);z-index:3}
#tools button{width:56px;height:56px;border:none;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;background:transparent;font-size:10px;color:var(--muted)}
#tools button svg{width:22px;height:22px}
#tools button:hover{background:var(--surface-2);color:var(--text)}
#tools button.active{background:var(--accent);color:#fff}
#tools button.on{background:var(--accent-soft);color:var(--accent)}
#tools button:disabled{opacity:.35;background:transparent}
#tools hr{border:none;border-top:1px solid var(--border);margin:4px 6px}
.cview{display:flex;gap:2px;justify-content:space-between;border-top:1px solid var(--border);padding-top:8px;margin-top:8px}
.cview button{width:36px;height:36px;padding:0;justify-content:center;border:none;background:transparent;color:var(--muted)}
.cview button:hover{background:var(--surface-2);color:var(--text)}
.cview button.on{background:var(--accent-soft);color:var(--accent)}
/* компактный виджет */
#widget{position:absolute;z-index:5}
#widget.capsule{display:flex;align-items:center;gap:6px;height:36px;padding:0 6px 0 12px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);font-size:12px;white-space:nowrap}
#widget.capsule b{font-weight:600}
#widget.capsule span{color:var(--muted)}
#widget.capsule button{height:28px;padding:0 8px;border:none;background:transparent;border-radius:14px;font-size:12px}
#widget.capsule button:hover{background:var(--surface-2)}
#widget.capsule button.iconbtn{width:28px}
/* панель свойств */
.panel{position:absolute;top:12px;right:12px;bottom:12px;width:320px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;overflow:auto;font-size:13px}
#props{z-index:6}
#props .back{border:none;background:transparent;padding:0 6px 0 0;height:32px;margin-bottom:6px;color:var(--muted)}
#props h4,#matPanel h4,#catalog h4,#dimlist h4{margin:0 0 10px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
#props .row,#matPanel .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}
#props .row span:first-child,#matPanel .row span:first-child{color:var(--muted);flex:1}
#props .row input{width:110px;text-align:right;height:32px}
#props .row select{height:32px}
#props .row.warn span{color:var(--warning)}
#props .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
#props .acts button{flex:1;height:32px;padding:0 8px;font-size:12px;justify-content:center}
#props .acts button.del{color:var(--danger)}
.lk{width:32px;height:32px;padding:0;justify-content:center;border:none;background:transparent}
.lk:hover{background:var(--surface-2)}
#dimlist{position:absolute;right:84px;top:12px;width:240px;max-height:calc(100% - 24px);overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;font-size:13px}
#dimlist div{display:flex;gap:8px;margin:3px 0}
#dimlist b{display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;text-align:center;line-height:20px;flex:none}
#status{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);pointer-events:none;background:var(--surface);padding:4px 10px;border-radius:8px;border:1px solid var(--border)}
/* диалоги */
#overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;pointer-events:none;background:transparent}
#overlay:not([hidden]){pointer-events:none}
#overlay[hidden]{display:none}
#dlg{pointer-events:auto;width:360px;max-width:calc(100vw - 24px);max-height:calc(100vh - 80px);overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:20px}
#dlg.wide{width:600px}
#dlg.xwide{width:820px}
#dlg h3{margin:0 0 14px;font-size:16px;font-weight:600}
#dlg .f{display:grid;grid-template-columns:1fr 150px;align-items:center;gap:8px;margin:8px 0}
#dlg .f .val{display:flex;gap:6px;align-items:center}
#dlg .f .val span{color:var(--muted);font-size:12px}
#dlg .f input[type=text]{width:100%;text-align:right}
#dlg .f select{width:100%}
#dlg .chk{display:flex;gap:8px;align-items:flex-start;margin:10px 0}
#dlg .chk input{margin-top:3px}
#dlg .hint{color:var(--muted);font-size:12px;margin:4px 0 8px}
#dlg .err{color:var(--danger);font-size:12px;min-height:18px;margin:6px 0}
#dlg .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
#dlg .alt{font-size:12px;height:30px;padding:0 10px}
#dlg .alt.on{background:var(--accent-soft);border-color:var(--accent)}
#dlg .row{display:flex;gap:8px;margin:6px 0;align-items:center}
#dlg .row select{flex:1}
#dlg .drow{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;margin:8px 0}
#dlg .drow .dl{grid-column:1/3;color:var(--muted);font-size:12px}
#dlg .drow .dv{display:flex;gap:4px;align-items:center}
#dlg .drow .dv input{width:80px;text-align:right;height:32px}
#dlg .drow .dv span{color:var(--muted);font-size:12px}
#dlg details summary{cursor:pointer;color:var(--accent);font-size:12px;margin:6px 0}
#dlg .pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:52vh;overflow:auto;margin:8px 0}
#dlg .pt{border:1px solid var(--border);border-radius:10px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;font-size:12px;align-items:center;text-align:center}
#dlg .pt:hover{border-color:var(--accent);background:var(--accent-soft)}
#dlg .pt img{width:84px;height:84px}
#dlg .pt b{font-size:12px}#dlg .pt span{color:var(--muted);font-size:11px}#dlg .pt i{font-size:10px;color:var(--accent);font-style:normal}
#dlg .pt.ph .q{width:84px;height:84px;border:2px dashed var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--accent)}
.seg{display:inline-flex;gap:2px;background:var(--surface-2);border-radius:8px;padding:2px}
.seg button{height:28px;padding:0 10px;font-size:12px;border:none;background:transparent;border-radius:6px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button:disabled{opacity:.4}
/* этап 3 */
.rcards{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.rcard{display:flex;gap:12px;padding:12px;border:2px solid var(--border);border-radius:12px;cursor:pointer;text-align:left;height:auto;align-items:flex-start;background:var(--surface)}
.rcard:hover{background:var(--surface-2)}
.rcard.on{border-color:var(--accent);background:var(--accent-soft)}
.rcard svg{width:22px;height:22px;margin-top:2px;color:var(--accent)}
.rcard b{display:block;font-size:14px;margin-bottom:2px}
.rcard span{color:var(--muted);font-size:12px;white-space:normal;line-height:1.4}
.summary{display:flex;gap:12px;color:var(--muted);font-size:12px;margin:8px 0}
.summary b{color:var(--text)}
.aitable{display:grid;grid-template-columns:36px 1fr auto;gap:6px 10px;align-items:center;max-height:44vh;overflow:auto;margin:8px 0;padding-right:4px}
.aitable img{width:32px;height:32px}
.aitable .nm{font-size:13px}.aitable .nm small{display:block;color:var(--muted);font-size:11px}
.aitable .hd{grid-column:1/4;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;padding:6px 0 2px;border-bottom:1px solid var(--border)}
.roomblk{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;margin:10px 0}
.roomblk h5{grid-column:1/3;margin:6px 0 2px;font-size:12px;color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{height:28px;padding:0 12px;border-radius:14px;background:var(--surface-2);border:1px solid transparent;font-size:12px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pcard{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:10px;border:1px solid var(--border);border-radius:12px;margin:8px 0;align-items:start}
.pcard.bad{border-color:var(--danger)}
.pcard img{width:96px;height:96px;object-fit:cover;border-radius:8px}
.pcard textarea{width:100%;margin-top:6px}
.pcard .pc-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.drop{border:1px dashed var(--border);border-radius:10px;padding:14px;text-align:center;color:var(--muted);margin:6px 0}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.lnk{color:var(--accent);cursor:pointer;text-decoration:underline}
.lnk input{display:none}
#result{position:absolute;inset:0;z-index:7;background:var(--bg);overflow:auto;padding:24px}
#result .wrap{max-width:900px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:16px}
#result h2{grid-column:1/3;margin:0 0 4px;font-size:20px;font-weight:600}
#result .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
#result .card h4{margin:0 0 10px;font-size:14px}
#result .card .row{display:flex;justify-content:space-between;gap:8px;margin:4px 0;font-size:13px}
#result .card .row span:first-child{color:var(--muted)}
#result .views{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
#result .acts{grid-column:1/3;display:flex;gap:8px;justify-content:flex-end}
#result .photos{display:flex;flex-wrap:wrap;gap:8px}
#result .photos img{width:72px;height:72px;object-fit:cover;border-radius:8px}
/* тосты */
#toasts{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:60;pointer-events:none}
.toast{background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);animation:in .18s ease-out;display:flex;gap:8px;align-items:center}
.toast.err{background:var(--danger);color:#fff}
.toast svg{width:16px;height:16px}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
/* 3D */
#view3d{position:absolute;inset:0;z-index:8;background:#000}
#c3{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.hud{position:absolute;display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px 10px;box-shadow:var(--shadow);font-size:12px;z-index:9;color:var(--muted)}
.hud.tl{left:12px;top:12px}
#compass{position:absolute;right:12px;bottom:12px;width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--accent);z-index:9;box-shadow:var(--shadow)}
#compass svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#minimap{position:absolute;left:12px;bottom:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px;box-shadow:var(--shadow);z-index:9}
#minimap canvas{display:block;border-radius:8px;cursor:pointer}
#minimap.min canvas{display:none}
#minimap button{position:absolute;right:4px;top:4px;width:24px;height:24px;padding:0;justify-content:center;border:none;background:transparent}
#minimap.min{width:36px;height:36px}
#hint3d{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:6px 12px;border-radius:8px;font-size:12px;z-index:9;pointer-events:none}
#matPanel{position:absolute;right:12px;top:12px;bottom:12px;width:320px;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;z-index:9;font-size:13px;transition:width .15s}
#matPanel.collapsed{width:40px;padding:8px 4px;overflow:hidden}
#matPanel.collapsed > *:not(.coll){display:none!important}
#matPanel .coll{position:absolute;left:4px;top:8px;width:32px;height:32px;padding:0;justify-content:center;border:none;background:transparent}
#matPanel:not(.collapsed) .coll{position:static;margin-right:4px}
#matPanel .x{width:32px;height:32px;padding:0;justify-content:center;border:none;background:transparent}
#matPanel .tabs{display:flex;gap:4px;margin-bottom:8px}
#matPanel .tabs button{flex:1;height:32px;justify-content:center;padding:0}
#matPanel .tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#matPanel .row input[type=text]{width:90px;text-align:right;height:32px}
#matPanel .row input[type=range]{width:110px}
#matPanel .row select{height:32px}
#matPanel .pal{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-bottom:8px}
#matPanel .pal button{aspect-ratio:1;height:auto;border-radius:6px;padding:0;border:1px solid var(--border)}

<body>
<div id="app">

<script>
'use strict';
/* ================= Константы ================= */
const SNAP_R=12, DIM_OFF=24, EDITOR_MARGIN=20000, ZOOM_MAX=5, VERTEX_R=5;
const MIN_WALL=100, MAX_WALL=50000, MIN_H=1000, MAX_H=10000, MIN_T=50, MAX_T=1000;
const DEF={door:{w:800,h:2000},window:{w:1200,h:1400,sill:900},arch:{w:900,h:2100},wallH:2700,wallT:150};
const KIND_NAME={door:'Дверь',window:'Окно',arch:'Арка'};
const UNITS={mm:{f:1,d:0,l:'мм'},cm:{f:10,d:1,l:'см'},m:{f:1000,d:3,l:'м'},in:{f:25.4,d:2,l:'in'},ftin:{f:25.4,d:0,l:'ft-in'}};
const uid=()=>Math.random().toString(36).slice(2,10);

/* ================= Единицы ================= */
function fmt(mm,unit=P.unit){
  if(unit==='ftin'){
    const inch=mm/25.4; let ft=Math.floor(inch/12); let e=Math.round((inch-ft*12)*8); let wi=Math.floor(e/8), fr=e%8;
    if(wi>=12){ft++;wi-=12;}
    let s=`${ft}'`; if(wi||fr){s+=wi; if(fr){let n=fr,d=8; while(n%2===0){n/=2;d/=2;} s+=` ${n}/${d}`;} s+='"';}
    return s;
  }
  const u=UNITS[unit]; let s=(mm/u.f).toFixed(u.d); if(u.d>0) s=s.replace(/\.?0+$/,''); return s;
}
function fmtU(mm){return fmt(mm)+' '+UNITS[P.unit].l;}
function parseLen(str,unit=P.unit){
  str=String(str||'').trim().replace(',','.'); if(!str) return NaN;
  if(unit==='ftin'){
    const m=str.match(/^(\d+)\s*'?\s*(?:(\d+(?:\.\d+)?)?(?:\s+(\d+)\/(\d+))?\s*"?)?$/);
    if(!m) return NaN; let inch=+m[1]*12+(+m[2]||0)+(m[3]?(+m[3]/+m[4]):0); return Math.round(inch*25.4);
  }
  const v=Number(str); if(!isFinite(v)) return NaN; return Math.round(v*UNITS[unit].f);
}
function m2(mm2){return (mm2/1e6).toFixed(2)+' м²';}

/* ================= Состояние ================= */
let P, D, hist=[], hi=-1;
function newProject(){
  return {id:uid(),name:'Новый проект',unit:'cm',wallHeight:DEF.wallH,wallThickness:DEF.wallT,lengthsIncludeThickness:false,
    wallParamsSet:false,floor:{material:{type:'color',color:'#d9cfbf'}},viewPointsVisible:true,eyeHeight:1600,photos:[],mode:'walls',furniture:[],fseq:{},status:'draft',showAiBadges:false,panelCollapsed:false,vertices:[],walls:[],openings:[],closed:false,showDims:false,seq:{door:0,window:0,arch:0},
    viewport:{x:0,y:0,zoom:0.08},createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
}
const E={propsOpen:false,copyMode:false,tool:'select',mode:'idle',sel:null,hover:null,start:null,stretch:null,ghost:null,openParams:null,drag:null,dialogOpen:false,hintUntil:0,activeDim:null,pointers:new Map(),gesture:null,pan:null,space:false,dimHits:[],markers:[],ctx:null,W:0,H:0,dpr:1,cursorW:null,zoomHintShown:false};

/* ================= Геометрия ================= */
const sub=(a,b)=>({x:a.x-b.x,y:a.y-b.y}), dot=(a,b)=>a.x*b.x+a.y*b.y, hyp=(a)=>Math.hypot(a.x,a.y);
function orient(a,b,c){const v=(b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x); return Math.abs(v)<1e-6?0:(v>0?1:-1);}
function onSeg(a,b,c){return Math.min(a.x,b.x)-1e-6<=c.x&&c.x<=Math.max(a.x,b.x)+1e-6&&Math.min(a.y,b.y)-1e-6<=c.y&&c.y<=Math.max(a.y,b.y)+1e-6;}
function segInter(p1,p2,p3,p4){
  const o1=orient(p1,p2,p3),o2=orient(p1,p2,p4),o3=orient(p3,p4,p1),o4=orient(p3,p4,p2);
  if(o1!==o2&&o3!==o4) return true;
  if(o1===0&&onSeg(p1,p2,p3))return true; if(o2===0&&onSeg(p1,p2,p4))return true;
  if(o3===0&&onSeg(p3,p4,p1))return true; if(o4===0&&onSeg(p3,p4,p2))return true; return false;
}
function distPtSeg(p,a,b){const ab=sub(b,a),L2=dot(ab,ab); if(L2<1e-9)return hyp(sub(p,a)); let t=dot(sub(p,a),ab)/L2; t=Math.max(0,Math.min(1,t)); return hyp(sub(p,{x:a.x+ab.x*t,y:a.y+ab.y*t}));}
function shoelace(pts){let s=0;for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];s+=a.x*b.y-b.x*a.y;}return s/2;}
function lineInter(p,d,q,e){const den=d.x*e.y-d.y*e.x; if(Math.abs(den)<1e-9)return null; const t=((q.x-p.x)*e.y-(q.y-p.y)*e.x)/den; return {x:p.x+d.x*t,y:p.y+d.y*t};}
function rectsOverlap(a,b,pad=0){return a.x<b.x+b.w+pad&&a.x+a.w+pad>b.x&&a.y<b.y+b.h+pad&&a.y+a.h+pad>b.y;}
function rectSegInter(r,a,b){
  if(a.x>=r.x&&a.x<=r.x+r.w&&a.y>=r.y&&a.y<=r.y+r.h)return true;
  const c=[{x:r.x,y:r.y},{x:r.x+r.w,y:r.y},{x:r.x+r.w,y:r.y+r.h},{x:r.x,y:r.y+r.h}];
  for(let i=0;i<4;i++) if(segInter(a,b,c[i],c[(i+1)%4]))return true; return false;
}

/* ================= Производные данные ================= */
function derive(p){
  const V=new Map(p.vertices.map(v=>[v.id,v])); const deg=new Map(), adj=new Map();
  p.vertices.forEach(v=>{deg.set(v.id,0);adj.set(v.id,[]);});
  p.walls.forEach(w=>{deg.set(w.a,deg.get(w.a)+1);deg.set(w.b,deg.get(w.b)+1);adj.get(w.a).push(w);adj.get(w.b).push(w);});
  let cycle=null, area=0;
  if(p.vertices.length>=3&&p.walls.length===p.vertices.length&&[...deg.values()].every(d=>d===2)){
    const order=[]; let cur=p.vertices[0].id, prevW=null, guard=0;
    while(guard++<p.vertices.length+1){ order.push(cur); const w=adj.get(cur).find(x=>x!==prevW); if(!w)break; const nxt=w.a===cur?w.b:w.a; prevW=w; cur=nxt; if(cur===order[0])break; }
    if(order.length===p.vertices.length&&cur===order[0]) cycle=order;
  }
  const cyclePos=new Map(cycle?cycle.map((id,i)=>[id,i]):[]);
  if(cycle) area=shoelace(cycle.map(id=>V.get(id)));
  const os=cycle?(area>0?-1:1):1;
  const W=new Map();
  for(const w of p.walls){
    const a=V.get(w.a),b=V.get(w.b); const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1; const ux=dx/len,uy=dy/len;
    const ortho=Math.abs(dx)<0.5||Math.abs(dy)<0.5, horiz=Math.abs(dy)<0.5;
    let s=1; if(cycle){const n=cycle.length; s=((cyclePos.get(w.a)+1)%n===cyclePos.get(w.b))?1:-1;}
    const nx=-uy*s*os, ny=ux*s*os;
    const refIsA=(a.y<b.y-0.5)||(Math.abs(a.y-b.y)<=0.5&&a.x<=b.x); const ref=refIsA?a:b, oth=refIsA?b:a;
    W.set(w.id,{w,a,b,len:Math.hypot(dx,dy),ux,uy,ortho,horiz,nx,ny,ref,oth,rx:(oth.x-ref.x)/len,ry:(oth.y-ref.y)/len,refIsA});
  }
  const convex=new Map();
  if(cycle){ const n=cycle.length; for(let i=0;i<n;i++){const pv=V.get(cycle[(i-1+n)%n]),c=V.get(cycle[i]),nx=V.get(cycle[(i+1)%n]); const cr=(c.x-pv.x)*(nx.y-c.y)-(c.y-pv.y)*(nx.x-c.x); convex.set(cycle[i],Math.sign(cr)===Math.sign(area));} }
  p.closed=!!cycle;
  return {V,deg,adj,cycle,area,W,convex};
}
function freeVertices(d=D,p=P){return p.vertices.filter(v=>d.deg.get(v.id)===1);}
function wallOpenings(wid,p=P){return p.openings.filter(o=>o.wallId===wid).sort((a,b)=>a.offset-b.offset);}
function kOf(wid,d=D,p=P){const w=p.walls.find(x=>x.id===wid); if(!d.cycle)return 2; return (d.convex.get(w.a)?1:0)+(d.convex.get(w.b)?1:0);}

/* ================= Валидация ================= */
function validateProject(p){
  const d=derive(p);
  for(const [id,dg] of d.deg) if(dg>2) return 'Точка не может соединять более двух стен';
  for(const w of p.walls){const i=d.W.get(w.id); if(i.len<MIN_WALL-0.5) return `Стена короче ${fmtU(MIN_WALL)}`; if(i.len>MAX_WALL+0.5) return `Стена длиннее ${fmtU(MAX_WALL)}`;}
  const ws=p.walls;
  for(let i=0;i<ws.length;i++)for(let j=i+1;j<ws.length;j++){
    const A=d.W.get(ws[i].id),B=d.W.get(ws[j].id);
    const shared=[ws[i].a,ws[i].b].filter(v=>v===ws[j].a||v===ws[j].b);
    if(shared.length===2) return 'Две стены совпадают';
    if(shared.length===1){
      const s=d.V.get(shared[0]); const o1=ws[i].a===shared[0]?A.b:A.a, o2=ws[j].a===shared[0]?B.b:B.a;
      if(orient(s,o1,o2)===0&&dot(sub(o1,s),sub(o2,s))>0) return 'Стена продолжает предыдущую. Измените длину предыдущей стены';
    } else if(segInter(A.a,A.b,B.a,B.b)) return 'Стена пересекает другую стену';
  }
  if(ws.length>0&&!d.cycle){
    const d1=[...d.deg.values()].filter(x=>x===1).length;
    if(d1!==2||ws.length!==p.vertices.length-1) return 'Контур должен быть одной непрерывной линией';
  }
  if(ws.length>0&&ws.length===p.vertices.length&&!d.cycle) return 'Контур должен быть одной непрерывной линией';
  for(const o of p.openings){
    const i=d.W.get(o.wallId); if(!i) return 'Проём без стены';
    if(o.offset<-0.5) return `${o.name}: отступ не может быть отрицательным`;
    if(o.offset+o.width>i.len+0.5) return `${o.name}: не помещается на стене (стена ${fmtU(i.len)})`;
    if(o.height>p.wallHeight+0.5) return `${o.name}: выше стены`;
    if(o.kind==='window'){ if(o.sill<0) return `${o.name}: «от пола» < 0`; if(o.sill+o.height>p.wallHeight+0.5) return `${o.name}: не помещается по высоте (max ${fmtU(p.wallHeight-o.sill)})`; }
    if(o.kind==='arch'){ if(o.radius<0||o.radius>o.width/2+0.5) return `${o.name}: радиус 0…${fmtU(o.width/2)}`; if(o.radius>o.height) return `${o.name}: радиус больше высоты`; }
    for(const q of p.openings){ if(q===o||q.wallId!==o.wallId)continue; if(o.offset<q.offset+q.width-0.5&&q.offset<o.offset+o.width-0.5) return `${o.name} пересекает ${q.name}`; }
  }
  if(p.mode==='furniture'){const fe=validateFurniture(p,d); if(fe)return fe;}
  return null;
}
function fitOffset(info,width,desired,excludeId,p=P){
  const occ=wallOpenings(info.w.id,p).filter(o=>o.id!==excludeId); let s=0; const gaps=[];
  for(const o of occ){ if(o.offset-s>=width-0.5) gaps.push([s,o.offset]); s=o.offset+o.width; }
  if(info.len-s>=width-0.5) gaps.push([s,info.len]);
  let best=null,bd=Infinity; for(const [g0,g1] of gaps){const c=Math.max(g0,Math.min(desired,g1-width)); const dd=Math.abs(c-desired); if(dd<bd){bd=dd;best=c;}}
  return best===null?null:Math.round(best);
}

/* ================= История и сохранение ================= */
function snapshot(){hist=hist.slice(0,hi+1);hist.push(JSON.stringify(P));if(hist.length>100)hist.shift();hi=hist.length-1;updateButtons();}
function restore(i){P=JSON.parse(hist[i]);hi=i;D=derive(P);E.sel=null;save();render();updateButtons();}
function undo(){if(hi>0)restore(hi-1);} function redo(){if(hi<hist.length-1)restore(hi+1);}
function apply(fn,opts={}){
  const Q=JSON.parse(JSON.stringify(P)); const r=fn(Q); if(typeof r==='string') return r;
  const err=validateProject(Q); if(err) return err; delete Q._strict;
  Q.updatedAt=new Date().toISOString(); P=Q; D=derive(P);
  if(!opts.noHist) snapshot(); save(); render(); return null;
}
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem('roomEditor.project',JSON.stringify(P));document.getElementById('saveInd').textContent='Сохранено '+new Date().toLocaleTimeString().slice(0,5);}catch(e){document.getElementById('saveInd').textContent='Не сохраняется';}},400);}
function load(){try{const s=localStorage.getItem('roomEditor.project'); if(s){const p=JSON.parse(s); if(p&&p.vertices)return p;}}catch(e){} return null;}

/* ================= Viewport ================= */
const vp=()=>P.viewport;
const S=(w)=>({x:w.x*vp().zoom+vp().x,y:w.y*vp().zoom+vp().y});
const Wd=(s)=>({x:(s.x-vp().x)/vp().zoom,y:(s.y-vp().y)/vp().zoom});
function roomBox(){ if(!P.vertices.length) return {x:-2500,y:-2500,w:5000,h:5000}; let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity; for(const v of P.vertices){x0=Math.min(x0,v.x);y0=Math.min(y0,v.y);x1=Math.max(x1,v.x);y1=Math.max(y1,v.y);} const m=P.wallThickness; return {x:x0-m,y:y0-m,w:x1-x0+2*m,h:y1-y0+2*m}; }
function worldBox(){const r=roomBox();return {x:r.x-EDITOR_MARGIN,y:r.y-EDITOR_MARGIN,w:r.w+2*EDITOR_MARGIN,h:r.h+2*EDITOR_MARGIN};}
function zoomMin(){const b=worldBox();return Math.min(E.W/b.w,E.H/b.h);}
function setView(x,y,zoom){
  zoom=Math.max(zoomMin(),Math.min(ZOOM_MAX,zoom));
  const b=worldBox(); const cx=(E.W/2-x)/zoom, cy=(E.H/2-y)/zoom;
  const ccx=Math.max(b.x,Math.min(b.x+b.w,cx)), ccy=Math.max(b.y,Math.min(b.y+b.h,cy));
  P.viewport={x:E.W/2-ccx*zoom,y:E.H/2-ccy*zoom,zoom}; save();
}
function zoomAt(sx,sy,factor){const w=Wd({x:sx,y:sy}); const z=Math.max(zoomMin(),Math.min(ZOOM_MAX,vp().zoom*factor)); setView(sx-w.x*z,sy-w.y*z,z); render();}
function fitRoom(){const r=roomBox(); const z=Math.min(E.W/(r.w*1.2),E.H/(r.h*1.2)); setView(E.W/2-(r.x+r.w/2)*z,E.H/2-(r.y+r.h/2)*z,z); render();}

/* ================= UI helpers ================= */
const $=(s)=>document.querySelector(s);
function toast(msg,err=false){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),err?3500:2500);}
function h(tag,attrs={},...kids){const el=document.createElement(tag);for(const k in attrs){if(k==='class')el.className=attrs[k];else if(k.startsWith('on'))el.addEventListener(k.slice(2),attrs[k]);else if(k==='html')el.innerHTML=attrs[k];else el.setAttribute(k,attrs[k]);}for(const c of kids){if(c==null)continue;el.appendChild(typeof c==='string'?document.createTextNode(c):c);}return el;}

/* ================= Диалоги ================= */
function dialog(build){
  return new Promise(res=>{

/* ================= Операции ================= */
function commitWall(startId,endPt,closeWithId,entered){
  let newId=null;
  const err=apply(Q=>{
    let bId=closeWithId; if(!bId){bId=uid();Q.vertices.push({id:bId,x:Math.round(endPt.x),y:Math.round(endPt.y)});}
    newId=uid(); Q.walls.push({id:newId,a:startId,b:bId,entered});
  });
  if(err){toast(err,true);return null;}
  if(P.closed) onClosed(newId);
  return newId;
}
function onClosed(closingWallId){
  if(P.lengthsIncludeThickness&&P.walls.some(w=>w.entered)) rebuildFromEntered(closingWallId);
  const per=P.walls.reduce((s,w)=>s+D.W.get(w.id).len,0);
  toast(`Контур замкнут. Площадь ${m2(Math.abs(D.area))}, периметр ${fmtU(Math.round(per))}`);
  E.mode='idle'; setTool('select');
}
function rebuildFromEntered(cId){
  const err=apply(Q=>{
    const d=derive(Q); const c=Q.walls.find(w=>w.id===cId); const V=new Map(Q.vertices.map(v=>[v.id,v]));
    const orig=new Map(Q.vertices.map(v=>[v.id,{x:v.x,y:v.y}]));
    let cur=c.b, prevW=c, guard=0;
    while(guard++<Q.walls.length){
      const w=d.adj.get(cur).find(x=>x!==prevW); if(!w||w===c)break;
      const other=w.a===cur?w.b:w.a; const oc=orig.get(cur),oo=orig.get(other); const dx=oo.x-oc.x,dy=oo.y-oc.y,L=Math.hypot(dx,dy);
      const k=(d.convex.get(w.a)?1:0)+(d.convex.get(w.b)?1:0);
      const nl=w.entered?Math.round(w.entered-Q.wallThickness*k):L; if(nl<MIN_WALL) return `Стена после пересчёта с толщиной короче ${fmtU(MIN_WALL)}`;
      const cv=V.get(cur),ov=V.get(other); ov.x=Math.round(cv.x+dx/L*nl); ov.y=Math.round(cv.y+dy/L*nl);
      prevW=w; cur=other; if(cur===c.a)break;
    }
  },{noHist:true});
  if(err) toast('Пересчёт с учётом толщины не выполнен: '+err,true); else snapshot();
}
function setWallLength(wid,newLen){
  return apply(Q=>{
    const d=derive(Q); const w=Q.walls.find(x=>x.id===wid); if(w.locked)return 'Стена зафиксирована. Снимите замок (L)'; if(Q.mode==='furniture')return 'Стены редактируются в режиме стен'; const i=d.W.get(wid); const V=new Map(Q.vertices.map(v=>[v.id,v]));
    const delta=newLen-i.len; const b=V.get(w.b); b.x=Math.round(b.x+i.ux*delta); b.y=Math.round(b.y+i.uy*delta);
    const next=d.adj.get(w.b).find(x=>x!==w);
    if(next&&d.W.get(next.id).ortho){const c=V.get(next.a===w.b?next.b:next.a); c.x=Math.round(c.x+i.ux*delta); c.y=Math.round(c.y+i.uy*delta);}
    if(w.entered!=null) w.entered=Math.round(newLen+Q.wallThickness*kOf(wid,d,Q));
    clampOpenings(Q,derive(Q));
  });
}
function clampOpenings(Q,d){ for(const o of Q.openings){const i=d.W.get(o.wallId); if(i&&o.offset+o.width>i.len) o.offset=Math.max(0,Math.round(i.len-o.width));} }
function deleteWall(wid){
  const w=P.walls.find(x=>x.id===wid); if(!w)return;
  if(P.mode==='furniture'){toast('Стены удаляются в режиме стен',true);return;}
  if(w.locked){toast('Стена зафиксирована. Снимите замок (L)',true);return;}
  const lo=wallOpenings(wid).filter(o=>o.locked); if(lo.length){toast('Зафиксированы проёмы: '+lo.map(o=>o.name).join(', '),true);return;}
  if(!P.closed&&D.deg.get(w.a)===2&&D.deg.get(w.b)===2){toast('Удалять можно только крайнюю стену незамкнутого контура',true);return;}
  const ops=wallOpenings(wid);
  const go=()=>{ const err=apply(Q=>{Q.walls=Q.walls.filter(x=>x.id!==wid);Q.openings=Q.openings.filter(o=>o.wallId!==wid);Q.furniture=(Q.furniture||[]).filter(f=>f.wallId!==wid);const used=new Set();Q.walls.forEach(x=>{used.add(x.a);used.add(x.b);});Q.vertices=Q.vertices.filter(v=>used.has(v.id));}); if(err)toast(err,true); else {E.sel=null;render();} };
  if(ops.length) confirmDlg('Удалить стену?',`Вместе со стеной удалятся: ${ops.map(o=>o.name).join(', ')}`).then(ok=>{if(ok)go();}); else go();
}
function deleteOpening(id){if(P.mode==='furniture'){toast('Проёмы удаляются в режиме стен',true);return;}if(P.openings.find(o=>o.id===id)?.locked){toast('Объект зафиксирован. Снимите замок (L)',true);return;}const err=apply(Q=>{Q.openings=Q.openings.filter(o=>o.id!==id);}); if(err)toast(err,true); else E.sel=null; render();}
function deleteSelected(){ if(!E.sel)return; if(E.sel.type==='furniture'){deleteFurniture(E.sel.id);return;} if(E.sel.type==='wall')deleteWall(E.sel.id); else if(E.sel.type==='opening')deleteOpening(E.sel.id); else toast('Точка удаляется вместе со стенами'); }

async function setTool(t){
  if(P.mode==='furniture'&&t!=='select'){toast('Стены и проёмы редактируются в режиме стен');return;}
  if(t==='wall'&&P.closed){toast('Контур замкнут. Удалите стену, чтобы изменить контур');return;}
  E.tool=t; E.mode='idle'; E.start=null; E.stretch=null; E.ghost=null; E.openParams=null; E.copyMode=false;
  if(t==='wall'){
    if(!P.wallParamsSet){const r=await wallParamsDialog(); if(!r){E.tool='select';updateTools();render();return;} const err=apply(Q=>{Object.assign(Q,r);Q.wallParamsSet=true;}); if(err){toast(err,true);} }
    E.mode='wallStart'; E.sel=null;
  } else if(t==='door'||t==='window'||t==='arch'){
    if(!P.walls.length){toast('Сначала нарисуйте стену',true);E.tool='select';updateTools();return;}
    const r=await openingDialog(t); if(!r){E.tool='select';updateTools();render();return;}
    E.openParams=r; E.mode='openingPlace'; E.sel=null;
  }
  updateTools(); render();
}

function vertexNear(sp,excl){let best=null,bd=SNAP_R;for(const v of P.vertices){if(v.id===excl)continue;const d=hyp(sub(S(v),sp));if(d<=bd){bd=d;best=v;}}return best;}
function nearestWall(wp){let best=null,bd=Infinity;for(const w of P.walls){const i=D.W.get(w.id);const d=distPtSeg(wp,i.a,i.b)*vp().zoom;if(d<bd){bd=d;best=i;}}return best&&bd<=SNAP_R?best:null;}
function wallAtScreen(sp){let best=null,bd=Infinity;const wp=Wd(sp);for(const w of P.walls){const i=D.W.get(w.id);const off=wp.x*i.nx+wp.y*i.ny-(i.a.x*i.nx+i.a.y*i.ny);const along=dot(sub(wp,i.a),{x:i.ux,y:i.uy});let d;if(along>=0&&along<=i.len&&off>=-6/vp().zoom&&off<=P.wallThickness+6/vp().zoom)d=0;else d=distPtSeg(wp,i.a,i.b)*vp().zoom;if(d<bd){bd=d;best=i;}}return best&&bd<=8?best:null;}
function openingAtScreen(sp){const wp=Wd(sp);for(const o of P.openings){const i=D.W.get(o.wallId);const along=dot(sub(wp,i.ref),{x:i.rx,y:i.ry});const off=dot(sub(wp,i.ref),{x:i.nx,y:i.ny});const pad=6/vp().zoom;if(along>=o.offset-pad&&along<=o.offset+o.width+pad&&off>=-pad&&off<=P.wallThickness+pad)return o;}return null;}
function hitTest(sp){
  for(const hh of E.dimHits) if(sp.x>=hh.rect.x&&sp.x<=hh.rect.x+hh.rect.w&&sp.y>=hh.rect.y&&sp.y<=hh.rect.y+hh.rect.h) return {type:'dim',item:hh.item};
  const vpt=viewPointAtScreen(sp); if(vpt)return {type:'viewpoint',id:vpt.index};
  const fu=furnitureAtScreen(sp); if(fu)return {type:'furniture',id:fu.id};
  const o=openingAtScreen(sp); if(o)return {type:'opening',id:o.id};
  const v=vertexNear(sp); if(v)return {type:'vertex',id:v.id};
  const w=wallAtScreen(sp); if(w)return {type:'wall',id:w.w.id};
  if(P.closed&&pointInPoly(Wd(sp),innerPoly()))return {type:'floor'};
  return null;
}
function computeStretch(startV,cw){
  const sp=S(cw); const near=vertexNear(sp,startV.id); const free=freeVertices();
  if(near&&D.deg.get(near.id)===1&&free.length===2) return {mode:'diag',end:near,len:hyp(sub(near,startV))};
  const blocked=near&&D.deg.get(near.id)>=2?near:null;
  const dx=cw.x-startV.x,dy=cw.y-startV.y; const horiz=Math.abs(dx)>=Math.abs(dy);
  const dirx=horiz?Math.sign(dx)||1:0, diry=horiz?0:Math.sign(dy)||1; let len=Math.abs(horiz?dx:dy); let guide=null;
  for(const v of P.vertices){ if(v.id===startV.id)continue; const L=horiz?(v.x-startV.x)*dirx:(v.y-startV.y)*diry; if(L>MIN_WALL-1&&Math.abs(L-len)*vp().zoom<=SNAP_R&&(!guide||Math.abs(L-len)<Math.abs(guide.L-len))){guide={v,L};} }
  if(guide) len=guide.L;
  const end={x:startV.x+dirx*len,y:startV.y+diry*len};
  const closes=free.find(v=>v.id!==startV.id&&Math.abs(v.x-end.x)<1&&Math.abs(v.y-end.y)<1)||null;
  return {mode:'ortho',dirx,diry,len,end,guide:guide?guide.v:null,closes,blocked};
}
function computeGhost(cw){
  const info=nearestWall(cw); if(!info)return null; const p=E.openParams;
  if(info.len<p.width-0.5) return {info,invalid:'Стена короче проёма'};
  const proj=dot(sub(cw,info.ref),{x:info.rx,y:info.ry}); const off=fitOffset(info,p.width,proj-p.width/2,null);
  if(off===null) return {info,invalid:'Нет места между проёмами'};
  return {info,offset:off};
}
function newOpeningName(kind){P.seq=P.seq||{door:0,window:0,arch:0};return `${KIND_NAME[kind]} ${(P.seq[kind]||0)+1}`;}

async function onClick(sp){
  const cw=Wd(sp);
  if(E.mode==='idle'){
    const hit=hitTest(sp);
    if(!hit){E.sel=null;E.propsOpen=false;render();return;}
    if(hit.type==='dim'){await editDim(hit.item);return;}
    if(hit.type==='viewpoint'){enter3D(hit.id);return;}
    if(hit.type==='floor'){E.sel={type:'floor'};render();return;}
    const same=E.sel&&E.sel.type===hit.type&&E.sel.id===hit.id; if(same){E.propsOpen=true;} else {E.sel={type:hit.type,id:hit.id};E.propsOpen=false;} render(); return;
  }
  if(E.mode==='fPlace'){await placeFurnitureClick(cw);return;}
  if(E.mode==='wallStart'){
    if(!P.vertices.length){ const id=uid(); const err=apply(Q=>{Q.vertices.push({id,x:Math.round(cw.x),y:Math.round(cw.y)});},{noHist:true}); if(err)return toast(err,true); E.start=P.vertices.find(v=>v.id===id); E.mode='wallStretch'; render(); return; }
    const v=vertexNear(sp);
    if(v&&D.deg.get(v.id)===1){E.start=v;E.mode='wallStretch';E.stretch=computeStretch(v,cw);render();return;}
    if(v){toast('Нельзя присоединить: точка уже соединяет две стены',true);return;}
    E.hintUntil=Date.now()+1000; toast('Продолжите контур от свободной точки'); render(); return;
  }
  if(E.mode==='wallStretch'){
    const st=computeStretch(E.start,cw); E.stretch=st;
    if(st.mode==='diag'){
      if(st.len<MIN_WALL)return toast(`Стена короче ${fmtU(MIN_WALL)}`,true);
      const id=commitWall(E.start.id,null,st.end.id); if(id){const ang=Math.round(Math.atan2(st.end.y-E.start.y,st.end.x-E.start.x)*180/Math.PI*10)/10; toast(`Длина ${fmtU(Math.round(st.len))}, угол ${ang}°`);} render(); return;
    }
    if(st.blocked){toast('Нельзя присоединить: точка уже соединяет две стены',true);return;}
    if(st.closes){
      const r=await lengthDialog(Math.round(st.len),{closing:true}); if(!r){render();return;}
      commitWall(E.start.id,null,st.closes.id); render(); return;
    }
    const start=E.start; const prefill=Math.max(MIN_WALL,Math.round(st.len/10)*10);
    E.activeDim={type:'temp'};
    const r=await lengthDialog(P.lengthsIncludeThickness?prefill+2*P.wallThickness:prefill,{validate:(len)=>{
      const end={x:start.x+st.dirx*len,y:start.y+st.diry*len}; const Q=JSON.parse(JSON.stringify(P)); const bId=uid(); Q.vertices.push({id:bId,...end}); Q.walls.push({id:uid(),a:start.id,b:bId}); return validateProject(Q);}});
    E.activeDim=null;
    if(!r){render();return;}
    const end={x:start.x+st.dirx*r.len,y:start.y+st.diry*r.len};
    const closeV=freeVertices().find(v=>v.id!==start.id&&Math.abs(v.x-end.x)<1&&Math.abs(v.y-end.y)<1);
    const id=commitWall(start.id,end,closeV?closeV.id:null,r.entered);
    if(id&&!P.closed){const w=P.walls.find(x=>x.id===id); E.start=D.V.get(w.b); E.mode='wallStretch'; E.stretch=null;}
    if(!id&&P.vertices.length===1&&!P.walls.length){/* первая точка осталась */}
    render(); return;
  }
  if(E.mode==='openingPlace'){
    const g=computeGhost(cw); if(!g||g.invalid){if(g)toast(g.invalid,true);return;}
    const p=E.openParams; const kind=p.kind; const id=uid(); const name=p.name||newOpeningName(kind);
    const o={id,kind,name,wallId:g.info.w.id,offset:g.offset,width:p.width,height:p.height,sill:p.sill,head:p.head,radius:p.radius,hinge:p.hinge||'left',swing:p.swing||'in'};
    const err=apply(Q=>{Q.openings.push(o);Q.seq=Q.seq||{door:0,window:0,arch:0};if(!p.name)Q.seq[kind]=(Q.seq[kind]||0)+1;},{noHist:true}); if(err)return toast(err,true);
    E.sel={type:'opening',id}; E.activeDim={type:'opening',id}; render();
    const r=await positionDialog(P.openings.find(x=>x.id===id));
    E.activeDim=null;
    if(!r){ apply(Q=>{Q.openings=Q.openings.filter(x=>x.id!==id);if(!p.name)Q.seq[kind]--;},{noHist:true}); E.sel=null; }
    else { const e2=apply(Q=>{Q.openings.find(x=>x.id===id).offset=r.offset;}); if(e2)toast(e2,true); }
    if(E.copyMode){ E.mode='openingPlace'; E.sel=null; E.ghost=null; }
    else { E.tool='select'; E.mode='idle'; E.openParams=null; E.ghost=null; }
    updateTools(); render(); return;
  }
}
function copyOpening(o){E.openParams={kind:o.kind,width:o.width,height:o.height,sill:o.sill,head:o.head,radius:o.radius,hinge:o.hinge,swing:o.swing};E.copyMode=true;E.sel=null;E.tool=o.kind;E.mode='openingPlace';E.ghost=null;updateTools();render();}

function duplicateOpening(o){const i=D.W.get(o.wallId);const off=o.offset+o.width;const fits=off+o.width<=i.len+0.5&&!wallOpenings(o.wallId).some(q=>q.id!==o.id&&off<q.offset+q.width&&q.offset<off+o.width);
  if(fits){const id=uid();const name=newOpeningName(o.kind);const err=apply(Q=>{Q.openings.push(Object.assign({},o,{id,name,offset:off}));Q.seq[o.kind]=(Q.seq[o.kind]||0)+1;});if(err)toast(err,true);else E.sel={type:'opening',id};render();}

async function editDim(item){
  if(item.kind==='fchain'){const f=P.furniture.find(x=>x.id===item.fid);if(!f)return;if(f.locked){toast('Объект зафиксирован. Снимите замок (L)');return;}E.sel={type:'furniture',id:f.id};E.activeDim={type:'furniture',id:f.id};render();const r=await fPositionDialog(f);E.activeDim=null;if(r){const err=fUpdate(f.id,q=>Object.assign(q,r));if(err)toast(err,true);}render();return;}

  if(item.kind==='chain'){ const o=P.openings.find(x=>x.id===item.openingId); E.sel={type:'opening',id:o.id}; E.activeDim={type:'opening',id:o.id}; render();
    const r=await positionDialog(o); E.activeDim=null; if(r){const err=apply(Q=>{Q.openings.find(x=>x.id===o.id).offset=r.offset;}); if(err)toast(err,true);} render(); }

async function repositionOpening(o){ if(o.locked||P.mode==='furniture'){toast('Объект зафиксирован',true);return;} E.openParams={kind:o.kind,name:o.name,width:o.width,height:o.height,sill:o.sill,head:o.head,radius:o.radius,hinge:o.hinge,swing:o.swing}; apply(Q=>{Q.openings=Q.openings.filter(x=>x.id!==o.id);},{noHist:true}); E.sel=null; E.tool=o.kind; E.mode='openingPlace'; updateTools(); render(); }

function beginDrag(hit,sp){
  const cw=Wd(sp);
  if(P.mode==='furniture'){toast('Стены и проёмы в режиме мебели только для просмотра');return false;}
  if(hit.type==='opening'&&P.openings.find(x=>x.id===hit.id)?.locked){toast('Объект зафиксирован. Снимите замок (L)');return false;}
  if(hit.type==='vertex'&&D.adj.get(hit.id).some(w=>w.locked)){toast('Стена зафиксирована. Снимите замок (L)');return false;}
  if(hit.type==='opening'){const o=P.openings.find(x=>x.id===hit.id); const i=D.W.get(o.wallId); const proj=dot(sub(cw,i.ref),{x:i.rx,y:i.ry}); E.drag={type:'opening',id:o.id,grab:proj-o.offset,orig:o.offset}; E.activeDim={type:'opening',id:o.id}; return true;}
  if(hit.type==='vertex'){
    const v=D.V.get(hit.id); const ws=D.adj.get(v.id); let axis=null,wall=null;
    if(ws.length===1){const i=D.W.get(ws[0].id);axis={x:i.ux,y:i.uy};wall=ws[0];}
    else { const i1=D.W.get(ws[0].id),i2=D.W.get(ws[1].id);
      if(i1.ortho&&i2.ortho){ if(Math.abs(i1.ux*i2.ux+i1.uy*i2.uy)>0.99){axis={x:i1.ux,y:i1.uy};wall=ws[0];} else {toast('Обе стены перпендикулярны — измените длину стены');return false;} }
      else if(i1.ortho){axis={x:i1.ux,y:i1.uy};wall=ws[0];} else if(i2.ortho){axis={x:i2.ux,y:i2.uy};wall=ws[1];} else {toast('Обе стены диагональные — измените длины');return false;} }
    E.drag={type:'vertex',id:v.id,axis,wallId:wall.id,orig:{x:v.x,y:v.y},start:{x:v.x,y:v.y}}; E.activeDim={type:'vertex',id:v.id}; return true;
  }
  return false;
}
function updateDrag(sp){
  const cw=Wd(sp); const dr=E.drag;
  if(dr.type==='opening'){const o=P.openings.find(x=>x.id===dr.id);const i=D.W.get(o.wallId);const proj=dot(sub(cw,i.ref),{x:i.rx,y:i.ry});const off=fitOffset(i,o.width,proj-dr.grab,o.id);if(off!==null)o.offset=off;}
  else { const v=D.V.get(dr.id); const t=dot(sub(cw,dr.start),dr.axis); v.x=Math.round(dr.start.x+dr.axis.x*t); v.y=Math.round(dr.start.y+dr.axis.y*t); D=derive(P); }
  render();
}
async function endDrag(){
  const dr=E.drag; E.drag=null;
  if(dr.type==='opening'){ const o=P.openings.find(x=>x.id===dr.id); const cur=o.offset; o.offset=dr.orig; const tmp=Object.assign({},o,{offset:cur});
    const r=await positionDialog(tmp); E.activeDim=null;
    if(r){const err=apply(Q=>{Q.openings.find(x=>x.id===o.id).offset=r.offset;}); if(err)toast(err,true);} render(); return; }
  const v=D.V.get(dr.id); const cur={x:v.x,y:v.y}; v.x=dr.orig.x;v.y=dr.orig.y; D=derive(P);
  const w=P.walls.find(x=>x.id===dr.wallId); const other=D.V.get(w.a===v.id?w.b:w.a); const newLen=Math.round(hyp(sub(cur,other)));
  const r=await lengthDialog(P.lengthsIncludeThickness?newLen+P.wallThickness*kOf(w.id):newLen,{title:'Длина стены после сдвига'}); E.activeDim=null;
  if(r&&r.len>0){ const dir={x:(cur.x-other.x)/(newLen||1),y:(cur.y-other.y)/(newLen||1)}; const err=apply(Q=>{const vv=Q.vertices.find(x=>x.id===v.id); vv.x=Math.round(other.x+dir.x*r.len); vv.y=Math.round(other.y+dir.y*r.len); clampOpenings(Q,derive(Q));}); if(err)toast(err,true); }
  render();
}

const cv=$('#c');
function ptOf(e){const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
let downInfo=null;
cv.addEventListener('contextmenu',e=>e.preventDefault());

  cv.setPointerCapture(e.pointerId); const sp=ptOf(e); E.pointers.set(e.pointerId,sp);
  if(E.pointers.size===2){ const [a,b]=[...E.pointers.values()]; E.gesture={d0:Math.hypot(a.x-b.x,a.y-b.y)||1,c0:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},z0:vp().zoom,v0:{...vp()}}; downInfo=null; E.pan=null; return; }
  if(E.dialogOpen)return;

  downInfo={sp,moved:false,hit:null,touch:e.pointerType==='touch'};
  if(E.mode==='idle'){ downInfo.hit=hitTest(sp); if(!downInfo.hit&&downInfo.touch) E.pan={s:sp,v:{...vp()}}; const hh=downInfo.hit; if(hh&&hh.type!=='dim'&&hh.type!=='viewpoint'){const di=downInfo;di.lp=setTimeout(()=>{if(downInfo===di&&!di.moved){E.sel={type:hh.type,id:hh.id};E.propsOpen=true;di.consumed=true;render();}},450);} }
  if(E.mode==='wallStretch'){E.cursorW=Wd(sp);E.stretch=computeStretch(E.start,E.cursorW);render();}

  if(E.mode==='fPlace'){E.cursorW=Wd(sp);E.fGhost=computeFGhost(E.cursorW);render();}
});
cv.addEventListener('pointermove',e=>{
  const sp=ptOf(e); if(E.pointers.has(e.pointerId))E.pointers.set(e.pointerId,sp);
  if(E.gesture&&E.pointers.size===2){ const [a,b]=[...E.pointers.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y)||1, c={x:(a.x+b.x)/2,y:(a.y+b.y)/2}; const g=E.gesture;
    const z=Math.max(zoomMin(),Math.min(ZOOM_MAX,g.z0*d/g.d0)); const w={x:(g.c0.x-g.v0.x)/g.z0,y:(g.c0.y-g.v0.y)/g.z0}; setView(c.x-w.x*z,c.y-w.y*z,z); render(); return; }
  if(E.pan){setView(E.pan.v.x+sp.x-E.pan.s.x,E.pan.v.y+sp.y-E.pan.s.y,E.pan.v.zoom);render();return;}
  if(E.dialogOpen)return;
  E.cursorW=Wd(sp);
  if(downInfo&&!downInfo.moved&&hyp(sub(sp,downInfo.sp))>4){ downInfo.moved=true; clearTimeout(downInfo.lp); if(E.mode==='idle'&&downInfo.hit&&downInfo.hit.type==='furniture'){ if(!beginFDrag(P.furniture.find(x=>x.id===downInfo.hit.id),downInfo.sp)) downInfo=null; } else if(E.mode==='idle'&&downInfo.hit&&(downInfo.hit.type==='opening'||downInfo.hit.type==='vertex')){ if(!beginDrag(downInfo.hit,downInfo.sp)) downInfo=null; } else if(E.mode==='idle'&&!downInfo.hit){E.pan={s:downInfo.sp,v:{...vp()}};} }
  if(E.drag){if(E.drag.type==='furniture')updateFDrag(sp);else updateDrag(sp);return;}
  if(E.mode==='fPlace'){E.fGhost=computeFGhost(E.cursorW);render();return;}

  if(E.mode==='wallStart'){render();return;}
  const hv=E.mode==='idle'?hitTest(sp):null; const key=hv?hv.type+(hv.id||''):null;
  cv.style.cursor=E.mode==='idle'?(hv?(hv.type==='dim'?'text':'pointer'):'default'):'crosshair';
  if(key!==E.hover){E.hover=key;render();}
});
function onUp(e){
  const sp=ptOf(e); E.pointers.delete(e.pointerId);
  if(E.gesture){ if(E.pointers.size<2){E.gesture=null; downInfo=null; E.pan=null;} return; }
  if(E.pan){const wasClick=downInfo&&!downInfo.moved; E.pan=null; if(wasClick&&!E.dialogOpen)onClick(sp); downInfo=null; return;}
  if(E.drag){if(E.drag.type==='furniture')endFDrag();else endDrag();downInfo=null;return;}
  if(downInfo){clearTimeout(downInfo.lp);}
  if(downInfo&&!downInfo.moved&&!downInfo.consumed&&!E.dialogOpen){ onClick(sp); }
  downInfo=null;
}

  try{const r=await fetch('api/catalog/products',{headers:{Accept:'application/json'}});if(!r.ok)throw new Error(r.status);const j=await r.json();setProducts(j.products||[],'server');
    if(typeof T3!=='undefined'&&T3.active)T3.dirty=true; render();
  }catch(e){console.warn('Каталог сервера недоступен, используется демо‑набор',e);}
}
const mountOf=(t,f)=>f.mount||t.mount;

/* ---------- Габарит (локальные координаты, фронт = +y) ---------- */
function fpPoly(fp,d){
  const P2=(x,y)=>({x,y}); let pts=[];
  const W=d.W??d.A??d.DIA??500, Dd=d.D??d.L??d.DIA??500;
  if(fp==='rect'){pts=[P2(0,0),P2(W,0),P2(W,Dd),P2(0,Dd)];}
  else if(fp==='square'){pts=[P2(0,0),P2(W,0),P2(W,W),P2(0,W)];}
  else if(fp==='circle'){const r=(d.DIA||W)/2;for(let i=0;i<32;i++)pts.push(P2(r+r*Math.cos(i/32*Math.PI*2),r+r*Math.sin(i/32*Math.PI*2)));}
  else if(fp==='ellipse'){for(let i=0;i<32;i++)pts.push(P2(W/2+W/2*Math.cos(i/32*Math.PI*2),Dd/2+Dd/2*Math.sin(i/32*Math.PI*2)));}
  else if(fp==='L'){const A=d.A,B=d.B,D2=Math.min(d.D,A,B);pts=[P2(0,0),P2(A,0),P2(A,B),P2(A-D2,B),P2(A-D2,D2),P2(0,D2)];}
  else if(fp==='U'){const A=d.A,B=d.B,D2=Math.min(d.D,A/2,B);pts=[P2(0,0),P2(A,0),P2(A,B),P2(A-D2,B),P2(A-D2,D2),P2(D2,D2),P2(D2,B),P2(0,B)];}
  else if(fp==='quarter'){const r=d.R;pts=[P2(0,0),P2(r,0)];for(let i=1;i<12;i++){const a=i/12*Math.PI/2;pts.push(P2(r*Math.cos(a),r*Math.sin(a)));}pts.push(P2(0,r));}
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;pts.forEach(p=>{x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y);});
  const cx=(x0+x1)/2,cy=(y0+y1)/2; return {pts:pts.map(p=>P2(p.x-cx,p.y-cy)),w:x1-x0,h:y1-y0};
}
function fLocal(f){const t=TYPE.get(f.typeId);const fo=formOf(t,f.formId);return fpPoly(fo.fp,f.dims);}
function fWorld(f){const l=fLocal(f);const r=f.rot*Math.PI/180,c=Math.cos(r),s=Math.sin(r),m=f.mirror?-1:1;return l.pts.map(p=>({x:f.x+(p.x*m)*c-p.y*s,y:f.y+(p.x*m)*s+p.y*c}));}
function aabbOf(pts){let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;pts.forEach(p=>{x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y);});return {x0,y0,x1,y1,w:x1-x0,h:y1-y0,cx:(x0+x1)/2,cy:(y0+y1)/2};}
function shrink(pts,mm){const c=aabbOf(pts);return pts.map(p=>{const dx=p.x-c.cx,dy=p.y-c.cy,L=Math.hypot(dx,dy)||1;return {x:p.x-dx/L*mm,y:p.y-dy/L*mm};});}
function segCross(p1,p2,p3,p4){const o=(a,b,c)=>{const v=(b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x);return Math.abs(v)<1?0:Math.sign(v);};const o1=o(p1,p2,p3),o2=o(p1,p2,p4),o3=o(p3,p4,p1),o4=o(p3,p4,p2);return o1*o2<0&&o3*o4<0;}
function polyIntersect(A0,B0){const A=shrink(A0,1),B=shrink(B0,1);for(let i=0;i<A.length;i++)for(let j=0;j<B.length;j++)if(segCross(A[i],A[(i+1)%A.length],B[j],B[(j+1)%B.length]))return true;return A.some(q=>pointInPoly(q,B0))||B.some(q=>pointInPoly(q,A0));}
function insideRoom(pts,p=P,d=D){const poly=d.cycle?d.cycle.map(id=>d.V.get(id)):null;if(!poly)return false;const s=shrink(pts,2);if(!s.every(q=>pointInPoly(q,poly)))return false;for(const w of p.walls){const i=d.W.get(w.id);for(let k=0;k<s.length;k++)if(segCross(s[k],s[(k+1)%s.length],i.a,i.b))return false;}return true;}
function fWorldOf(f,p,d){ // для валидации на клоне
  const t=TYPE.get(f.typeId);const fo=formOf(t,f.formId);const mt=mountOf(t,fo);
  if(mt==='wall'){const i=d.W.get(f.wallId);if(!i)return null;const c={x:i.ref.x+i.rx*(f.offset+f.dims.W/2),y:i.ref.y+i.ry*(f.offset+f.dims.W/2)};const r=Math.atan2(i.nx,-i.ny);const dd=f.dims.D;const cx=c.x-i.nx*dd/2,cy=c.y-i.ny*dd/2;const l=fpPoly(fo.fp,f.dims);const cs=Math.cos(r),sn=Math.sin(r);return l.pts.map(q=>({x:cx+q.x*cs-q.y*sn,y:cy+q.x*sn+q.y*cs}));}
  return fWorld(f);
}
function doorZones(p=P,d=D){const z=[];for(const o of p.openings){if(o.kind!=='door')continue;const i=d.W.get(o.wallId);if(!i)continue;const hingeA=o.hinge==='left'?o.offset:o.offset+o.width;const hp={x:i.ref.x+i.rx*hingeA,y:i.ref.y+i.ry*hingeA};const dirA=o.hinge==='left'?1:-1;const inward=o.swing==='in'?-1:1;const ax={x:i.rx*dirA,y:i.ry*dirA},ay={x:i.nx*inward,y:i.ny*inward};if(inward>0)continue;const pts=[hp];for(let k=0;k<=8;k++){const a=k/8*Math.PI/2;pts.push({x:hp.x+(ax.x*Math.cos(a)+ay.x*Math.sin(a))*o.width,y:hp.y+(ax.y*Math.cos(a)+ay.y*Math.sin(a))*o.width});}z.push({name:o.name,pts});}return z;}
function windowZones(p=P,d=D){const z=[];for(const o of p.openings){if(o.kind!=='window')continue;const i=d.W.get(o.wallId);if(!i)continue;const a={x:i.ref.x+i.rx*o.offset,y:i.ref.y+i.ry*o.offset},b={x:i.ref.x+i.rx*(o.offset+o.width),y:i.ref.y+i.ry*(o.offset+o.width)};const n={x:-i.nx*300,y:-i.ny*300};z.push({name:o.name,pts:[a,b,{x:b.x+n.x,y:b.y+n.y},{x:a.x+n.x,y:a.y+n.y}]});}return z;}
function furnitureWarnings(f,p=P,d=D){const w=[];const pts=fWorldOf(f,p,d);if(!pts)return ['outside'];const t=TYPE.get(f.typeId);const mt=mountOf(t,formOf(t,f.formId));if((mt==='floor'||mt==='ceiling')&&!insideRoom(pts,p,d))w.push('outside');if(mt==='floor'){for(const z of doorZones(p,d))if(polyIntersect(pts,z.pts)){w.push('door');break;}for(const z of windowZones(p,d))if(polyIntersect(pts,z.pts)){w.push('window');break;}}return w;}
function validateFurniture(p,d){
  if(!d.cycle)return null; const items=p.furniture||[]; const polys=new Map(); const strict=p._strict?new Set(p._strict):null; const chk=(f)=>strict?strict.has(f.id):!(f.warnings||[]).includes('outside');
  for(const f of items){const pts0=fWorldOf(f,p,d);if(!pts0)return `${f.name}: стена не найдена`;polys.set(f.id,pts0);if(!chk(f))continue;const t=TYPE.get(f.typeId);if(!t)return `${f.name}: неизвестный тип`;const fo=formOf(t,f.formId);const mt=mountOf(t,fo);const pts=pts0;
    if(mt==='wall'){const i=d.W.get(f.wallId);if(f.offset<-0.5||f.offset+f.dims.W>i.len+0.5)return `${f.name}: не помещается на стене`;}
    else if(mt==='ontop'){const b=items.find(x=>x.id===f.baseId);if(!b)return `${f.name}: нет основания`;const bb=aabbOf(fWorldOf(b,p,d)),aa=aabbOf(pts);if(aa.x0<bb.x0-1||aa.x1>bb.x1+1||aa.y0<bb.y0-1||aa.y1>bb.y1+1)return `${f.name}: выходит за пределы основания`;}
    else if(!insideRoom(pts,p,d))return `${f.name}: вне комнаты или в стене`;
    if(f.productId){const pr=PRODUCTS.find(x=>x.id===f.productId);if(pr)for(const k in pr.dims)if(k!=='E'&&Math.abs((f.dims[k]||0)-pr.dims[k])>0.5)return `${f.name}: размеры товара фиксированы`;}
  }
  for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){const a=items[i],b=items[j];if(!chk(a)&&!chk(b))continue;const la=TYPE.get(a.typeId).layer,lb=TYPE.get(b.typeId).layer;const ma=mountOf(TYPE.get(a.typeId),formOf(TYPE.get(a.typeId),a.formId)),mb=mountOf(TYPE.get(b.typeId),formOf(TYPE.get(b.typeId),b.formId));
    let check=false;if(ma==='floor'&&mb==='floor'&&la==='floor'&&lb==='floor')check=true;if(ma==='ontop'&&mb==='ontop'&&a.baseId===b.baseId)check=true;if(ma==='wall'&&mb==='wall'&&a.wallId===b.wallId)check=true;if(ma==='ceiling'&&mb==='ceiling')check=true;
    if(check&&polyIntersect(polys.get(a.id),polys.get(b.id)))return `${a.name} пересекает ${b.name}`;}
  return null;
}

/* ---------- Отрисовка мебели в плане ---------- */
function drawFurniturePlan(ctx){
  const items=P.furniture||[]; if(!items.length)return; const faded=P.mode!=='furniture';
  const layers={under:0,floor:1,ontop:2}; const sorted=[...items].sort((a,b)=>layers[TYPE.get(a.typeId).layer]-layers[TYPE.get(b.typeId).layer]);
  for(const f of sorted)drawFurnitureItem(ctx,f,{faded,sel:E.sel?.type==='furniture'&&E.sel.id===f.id,hover:E.hover==='furniture'+f.id});
  if(E.mode==='fPlace'&&E.fGhost)drawFurnitureItem(ctx,E.fGhost.item,{ghost:E.fGhost.invalid?'bad':'ok'});
}

    const pref=h('div',{}); [['style','Стиль'],['palette','Палитра'],['budget','Бюджет']].forEach(([k,nm])=>{const ch=h('div',{class:'chips'});const rebuild=()=>{ch.innerHTML='';PREFS[k].forEach(v=>ch.append(h('button',{type:'button',class:'chip'+(prefs[k]===v?' on':''),onclick:()=>{prefs[k]=prefs[k]===v?undefined:v;rebuild();refresh();}},v)));};rebuild();pref.append(h('div',{class:'hint'},nm),ch);});

    const cards=[];

      const chips=h('div',{class:'chips'});LIKES.forEach(([k,nm])=>chips.append(h('button',{type:'button',class:'chip'+(p.likes.includes(k)?' on':''),onclick:()=>{const i=p.likes.indexOf(k);if(i>=0)p.likes.splice(i,1);else p.likes.push(k);fill();}},nm)));
      const body=h('div',{},h('div',{class:'pc-h'},h('span',{},`Фото ${idx+1} — что здесь нравится`),h('button',{class:'ghost',type:'button',onclick:()=>{photos.splice(idx,1);fill();}},ic('trash'),'Убрать')),chips);
      if(p.likes.includes('furniture')){const fch=h('div',{class:'chips'});const q=h('input',{type:'search',placeholder:'Какая мебель? Поиск по типам…',style:'height:30px;width:100%'});
        const fillT=()=>{fch.innerHTML='';const isAll=p.furnitureTypes==='all';fch.append(h('button',{type:'button',class:'chip'+(isAll?' on':''),onclick:()=>{p.furnitureTypes=isAll?[]:'all';fillT();refresh();}},'Вся мебель'));

      stline.hidden=ok;
      if(tried){cards.forEach((c,i)=>{const e=photoError(photos[i]);c.card.classList.toggle('bad',!!e);c.perr.textContent=e||'';});const tErr=!ok;ta.classList.toggle('bad',tErr);taErr.textContent=tErr?(text.trim()?'Опишите подробнее — хотя бы 10 символов':'Загрузите фото с отметками, выберите стиль или опишите пожелания'):'';}

      a.close(out({}));}}];
  });
}
function submitBrief(st){

  const brief={schemaVersion:2,createdAt:new Date().toISOString(),room:st.room,photos:st.photos,text:st.text||'',prefs:st.prefs,items:briefItems};
  const err=apply(Q=>{Q.brief=brief;Q.briefDraft=null;Q.status='submitted';Q.showAiBadges=true;(Q.furniture||[]).forEach(f=>{f.aiPolicy=st.policies.get(f.id)||'free';});}); if(err){toast(err,true);return;}
