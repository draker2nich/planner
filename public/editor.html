<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b">
<title>Редактор — furnitech</title>
<meta name="robots" content="noindex">
<script>/* Редактор только для вошедших (исключение — просмотр проекта поддержкой, ?view=). Гость уходит на вход ещё до загрузки редактора. */
(function(){if(/[?&]view=/.test(location.search))return;var ok=false;try{ok=!!localStorage.getItem('planner.token')}catch(e){}
if(!ok){try{document.documentElement.style.visibility='hidden'}catch(e){}location.replace('/login?next='+encodeURIComponent(location.pathname+location.search));}})();</script>
<script>try{var t=localStorage.getItem('planner.theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="shared/ui.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/meshopt_decoder.js"></script>
<script src="shared/catalog-types.js"></script>
<script src="shared/session.js"></script>
<link rel="stylesheet" href="js/editor/editor.css">
</head>
<body>
<div id="app">
<header>
  <a id="homeMark" href="/" aria-label="furnitech — на главную" translate="no"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19V9a3 3 0 0 1 3-3h4.5M9 12.5h5.5"/></svg></a>
  <div id="menuWrap"><button id="menuBtn" class="iconbtn ghost" aria-label="Меню" aria-haspopup="menu" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></button><div id="menu" class="dmenu" role="menu" hidden></div></div>
  <select id="unitSel" hidden aria-hidden="true" tabindex="-1"><option value="mm">мм</option><option value="cm">см</option><option value="m">м</option><option value="in">дюймы</option><option value="ftin">фут-дюйм</option></select>
  <input class="name" id="projName" value="Новый проект" aria-label="Название проекта" autocomplete="off" spellcheck="false" maxlength="80">
  <div class="segc hide3d" role="group" aria-label="Режим редактора"><button id="modeWalls" class="on" aria-pressed="true"><span class="lg">Стены и проёмы</span><span class="sh">Стены</span></button><button id="modeFurn" aria-pressed="false">Мебель</button></div>
  <button id="btnLock" class="iconbtn ghost hide3d"></button>
  <span class="hsep hide3d"></span>
  <button id="btnPoints" class="iconbtn ghost hide3d vw" data-view="points" data-tipkey="P"></button>
  <button id="btnDims" class="iconbtn ghost hide3d vw" data-view="dims" data-tipkey="D"></button>
  <button id="btnFit" class="iconbtn ghost hide3d vw" data-view="fit" data-tipkey="F"></button>
  <span class="hsep hide3d vw"></span>
  <button id="btnUndo" class="iconbtn ghost hide3d" data-view="undo"></button>
  <button id="btnRedo" class="iconbtn ghost hide3d" data-view="redo"></button>
  <button id="btnExit3d" class="only3d" aria-label="К плану"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg><span class="lg">К плану</span><span class="sh">План</span></button>
  <label class="only3d"><span class="lg">Высота глаз</span><input type="range" id="eyeH" min="1200" max="1900" step="50" aria-label="Высота глаз"><span id="eyeHv"></span></label>
  <button id="btnPoints3d" class="only3d" aria-label="Точки обзора" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span class="lg">Точки обзора</span></button>
  <span class="sp"></span>
  <span class="save hide3d" id="saveInd" role="status">—</span>
  <span id="acctBox" class="hide3d"></span>
  <button id="btnFinish" class="primary hide3d" hidden><span class="lg">Завершить</span><span class="sh">Готово</span></button>
</header>
<main>
  <canvas id="c" aria-label="План комнаты"></canvas>
  <aside id="tools" aria-label="Инструменты">
    <button data-tool="select" title="Выбор (V)"></button>
    <button data-tool="wall" title="Стена (W)"></button>
    <button data-tool="door" title="Дверь (O)"></button>
    <button data-tool="window" title="Окно (N)"></button>
    <button data-tool="arch" title="Арка (A)"></button>
  </aside>
  <div id="props" class="panel" role="region" aria-label="Свойства" hidden></div>
  <div id="result" hidden></div>
  <aside id="catalog" aria-label="Каталог мебели" hidden></aside>
  <div id="widget" hidden></div>
  <div id="dimlist" hidden></div>
  <div id="status" role="status" aria-live="polite"></div>
  <nav id="dock" aria-label="Панель инструментов">
    <button id="dockCat" class="primary" aria-expanded="false" aria-controls="catalog"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18v-6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v6M4 18h16M4 18v2M20 18v2M6 10V7a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v3"/></svg>Каталог</button>
    <div class="dk-tools"></div>
    <span class="sp"></span>
    <span class="dsep"></span>
    <button class="iconbtn ghost" data-view="undo"></button>
    <button class="iconbtn ghost" data-view="redo"></button>
  </nav>
  <div id="overlay" hidden><div id="dlg" role="dialog" aria-modal="true" tabindex="-1"></div></div>
  <div id="view3d" hidden>
    <canvas id="c3" aria-label="3D‑вид комнаты"></canvas>
    <div class="hud tl" id="lbl3d" aria-live="polite"></div>
    <div id="compass" title="Верх плана" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></div>
    <div id="minimap"><canvas id="mm" width="220" height="160" aria-label="Мини‑карта: нажмите, чтобы перейти к точке"></canvas><button id="mmToggle" aria-label="Свернуть или развернуть мини‑карту"></button></div>
    <div id="hint3d">ЛКМ — поворот · двойное нажатие — выбрать стену, пол или предмет · WASD / стрелки на полу — переход · Esc — к плану</div>
    <div id="matPanel" role="region" aria-label="Материал" hidden></div>
  </div>
  <div id="toasts" role="status" aria-live="polite"></div>
</main>
</div>
<!-- Порядок важен: ядро → интерфейс → 3D → мебель → оболочка → запуск → аккаунт. См. ТЗ этапа 2, раздел 9. -->
<script src="js/editor/core/units.js"></script>
<script src="js/editor/core/state.js"></script>
<script src="js/editor/core/geometry.js"></script>
<script src="js/editor/core/derive.js"></script>
<script src="js/editor/core/rows.js"></script>
<script src="js/editor/core/history.js"></script>
<script src="js/editor/ui/viewport.js"></script>
<script src="js/editor/ui/dialogs.js"></script>
<script src="js/editor/ui/operations.js"></script>
<script src="js/editor/ui/tools.js"></script>
<script src="js/editor/ui/render.js"></script>
<script src="js/editor/view3d/points.js"></script>
<script src="js/editor/view3d/materials.js"></script>
<script src="js/editor/view3d/scene.js"></script>
<script src="js/editor/view3d/panel.js"></script>
<script src="js/editor/furniture/geometry.js"></script>
<script src="js/editor/furniture/draw.js"></script>
<script src="js/editor/furniture/catalog.js"></script>
<script src="js/editor/furniture/place.js"></script>
<script src="js/editor/shell.js"></script>
<script src="js/editor/brief.js"></script>
<script src="js/editor/boot.js"></script>
<script src="js/editor/account.js"></script>
</body>
</html>
